<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronology</title>
<!-- Map: <style> = theme tokens + layout; <script> = window.__TIMELINE_DATA__ injection point, then the renderer IIFE (SAMPLE demo data, date helpers, layout, arrows, search/filter, dossier view). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f4f2'/%3E%3Cline x1='6' y1='16' x2='26' y2='16' stroke='%23b9b9b6' stroke-width='2'/%3E%3Ccircle cx='11' cy='16' r='3' fill='%23191919'/%3E%3Ccircle cx='21' cy='16' r='3' fill='%2355555a'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var t = localStorage.getItem("cs-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "light"; }
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --ink: #191919;
    --ink2: #55555a;
    --ink3: #98989b;
    --line: #e0e0dd;
    --line2: #c6c6c3;
    --spine: #c9c9c6;
    --link: #8f8f8c;
    --link-strong: #333330;
    --shadow: 0 1px 2px rgba(20,20,20,.05), 0 10px 28px -14px rgba(20,20,20,.18);
    --serif: "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #101010;
    --card: #1a1a1a;
    --ink: #f1f1ef;
    --ink2: #b4b4b1;
    --ink3: #77777a;
    --line: #2b2b2b;
    --line2: #3d3d3d;
    --spine: #353533;
    --link: #6c6c6a;
    --link-strong: #dcdcda;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  ::selection { background: var(--line2); }

  /* ---- top bar ---- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    max-width: 1180px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--serif); font-size: 14px; letter-spacing: .06em; color: var(--ink2); white-space: nowrap; }
  .brand em { color: var(--ink3); }
  .controls { display: flex; gap: 6px; }
  .controls button {
    font-family: var(--mono); font-size: 12px; min-width: 30px; height: 28px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .controls button:hover { border-color: var(--line2); color: var(--ink); }
  .controls .gap { width: 14px; }

  /* ---- page ---- */
  main { max-width: 1180px; margin: 0 auto; padding: 44px 20px 64px; overflow-x: clip; }
  .head { margin-bottom: 38px; text-align: center; }
  #title {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(26px, 4vw, 40px); letter-spacing: -.01em; line-height: 1.15;
    margin: 0;
  }
  #subtitle {
    margin: 12px auto 0; max-width: 660px;
    color: var(--ink2); font-size: 15px; line-height: 1.55;
  }

  /* ---- horizontal stage ---- */
  #stage {
    position: relative;
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
    -webkit-overflow-scrolling: touch;
    outline: none;
  }
  #stage.dragging { cursor: grabbing; user-select: none; }
  #stage:focus-visible { outline: 2px solid var(--line2); outline-offset: 6px; border-radius: 6px; }
  #stage::-webkit-scrollbar { height: 9px; }
  #stage::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; }
  #stage::-webkit-scrollbar-track { background: transparent; }

  #sizer { position: relative; margin: 0 auto; }
  #canvas { position: absolute; top: 0; left: 0; transform-origin: top left; }

  #links { position: absolute; top: 0; left: 0; z-index: 0; overflow: visible; pointer-events: none; }

  .col { position: absolute; z-index: 1; transition: opacity .25s ease; }
  .col.dim { opacity: .2; }
  .col.expanded { z-index: 6; }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    cursor: pointer; outline: none;
    transition: border-color .2s ease, opacity .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .card:hover, .card:focus-visible { border-color: var(--line2); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--line2); outline-offset: 2px; }
  .card.has-desc::after {
    content: "+"; position: absolute; top: 10px; right: 13px;
    font-family: var(--mono); font-size: 13px; color: var(--ink3);
  }
  .card.has-desc.expanded::after { content: "–"; }

  .ev-date { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink3); }
  .ev-title { font-size: 14.5px; font-weight: 600; line-height: 1.35; margin: 5px 0 0; color: var(--ink); }
  .ev-desc { display: none; margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink2); }
  .card.expanded .ev-desc { display: block; }
  .card.expanded { border-color: var(--line2); }

  .ev-sources { margin-top: 9px; font-size: 11px; line-height: 1.7; color: var(--ink3); }
  .ev-src-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink3); margin-right: 7px;
  }
  .ev-src { color: var(--ink2); }
  a.ev-src { text-decoration: underline dotted; text-underline-offset: 2px; }
  a.ev-src:hover { color: var(--ink); }
  .ev-src + .ev-src::before { content: "·"; margin: 0 7px; color: var(--ink3); }
  .card:not(.expanded) .ev-sources { max-height: 1.8em; overflow: hidden; }

  .ev-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 7px; }
  .card:not(.expanded) .ev-meta { max-height: 1.9em; overflow: hidden; }
  .ev-actor, .ev-tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .02em;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
    color: var(--ink2); white-space: nowrap;
  }
  .ev-tag { color: var(--ink3); }

  .ev-quote {
    margin: 9px 0 0; padding: 1px 0 1px 10px;
    border-left: 2px solid var(--line2);
    font-family: var(--serif); font-style: italic; font-size: 12.5px; line-height: 1.5; color: var(--ink2);
  }
  .ev-quote-attr {
    display: block; margin-top: 3px;
    font-family: var(--mono); font-style: normal; font-size: 9.5px; color: var(--ink3);
  }

  .ev-src-item { margin-top: 5px; }
  .ev-src-tier {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--ink3);
  }
  a.ev-src-arch { font-size: 10px; margin-left: 6px; color: var(--ink3); text-decoration: underline dotted; text-underline-offset: 2px; }
  a.ev-src-arch:hover { color: var(--ink); }
  .ev-src-excerpt { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.5; color: var(--ink3); }
  .ev-src-excerpt::before { content: "\201C"; }
  .ev-src-excerpt::after { content: "\201D"; }
  .ev-src-loc { font-size: 9.5px; color: var(--ink3); }
  .ev-src, a.ev-src { overflow-wrap: anywhere; }

  .gapband { stroke: var(--line2); stroke-width: 1; }
  .hatchline { stroke: var(--line2); stroke-width: 1; }
  .gaplabel {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .03em;
    fill: var(--ink3);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  }
  .lk.dimmed, .lklabel.dimmed { opacity: .15; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 20px; }
  .filters[hidden] { display: none; }
  #q {
    font-family: var(--mono); font-size: 12px; height: 30px; padding: 0 10px;
    width: 230px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); outline: none;
  }
  #q:focus-visible { border-color: var(--line2); outline: 2px solid var(--line2); outline-offset: 1px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-family: var(--mono); font-size: 11px; padding: 4px 11px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .pill:hover { border-color: var(--line2); color: var(--ink); }
  .pill.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .fcount { font-family: var(--mono); font-size: 11px; color: var(--ink3); }
  #fclear {
    font-family: var(--mono); font-size: 11px; background: none; border: none;
    color: var(--ink3); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px;
  }
  #fclear:hover { color: var(--ink); }
  #fclear[hidden] { display: none; }
  #dossierBtn, #printBtn {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  #dossierBtn:hover, #printBtn:hover { border-color: var(--line2); color: var(--ink); }
  #dossierBtn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .meth { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .meth summary {
    cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    color: var(--ink3); text-transform: uppercase;
  }
  .meth summary:hover { color: var(--ink2); }
  .meth-body { max-width: 760px; font-size: 12.5px; line-height: 1.65; color: var(--ink2); }
  .meth-audit { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin: 10px 0 0; }
  .meth-note { margin: 8px 0 0; }
  .meth-h { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin: 12px 0 0; }
  .meth-body ul { margin: 6px 0 0; padding-left: 18px; }

  .ev-desc, .ev-title { overflow-wrap: anywhere; }

  /* ---- phase 2: epistemic status ---- */
  .ev-top { display: flex; align-items: center; gap: 8px; padding-right: 20px; }
  .ev-top .ev-date { flex: 1 1 auto; }
  .ev-hop {
    flex: 0 0 auto; font-family: var(--mono); font-size: 9px; letter-spacing: .04em; color: var(--ink3);
    border: 1px dashed var(--line2); border-radius: 4px; padding: 0 4px; white-space: nowrap;
  }
  .ev-hop.root { border-style: solid; border-color: var(--ink2); color: var(--ink2); }
  .ev-status {
    flex: 0 0 auto; font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  }
  .ev-status.proven { background: var(--ink); border: 1px solid var(--ink); color: var(--bg); }
  .ev-status.corroborated { border: 1px solid var(--line2); color: var(--ink2); }
  .ev-status.inferred { border: 1px dashed var(--line2); color: var(--ink3); font-style: italic; }
  .ev-status.alleged { border: 3px double var(--line2); color: var(--ink2); }
  .ev-status.disputed { border: 1px solid var(--ink2); color: var(--ink2); }
  .card.status-proven { border: 1.5px solid var(--ink); }
  .card.status-corroborated { border-color: var(--line2); }
  .card.status-inferred { border-style: dashed; border-color: var(--line2); }
  .card.status-alleged { border: 3px double var(--line2); }
  .card.status-disputed { border-color: var(--ink2); }
  .card.status-disputed::before {
    content: ""; position: absolute; top: -1px; left: -1px; right: -1px; height: 6px;
    border-radius: 14px 14px 0 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, var(--ink3) 0 1px, transparent 1px 5px);
  }

  /* claim vs counter-claim */
  .ev-split { display: none; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card.expanded .ev-split { display: grid; grid-template-columns: 1fr 1fr; }
  .ev-split-col { padding: 7px 9px; min-width: 0; }
  .ev-split-col + .ev-split-col { border-left: 1px solid var(--line); }
  .ev-split-h { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 4px; }
  .ev-split-item { font-size: 10.5px; line-height: 1.5; color: var(--ink2); overflow-wrap: anywhere; }
  .ev-split-item + .ev-split-item { margin-top: 4px; }

  /* copy citation */
  .ev-copy {
    display: block; margin-top: 6px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    border: 1px solid var(--line); border-radius: 4px; background: none; color: var(--ink3);
    padding: 1px 6px; cursor: pointer;
  }
  .ev-copy:hover, .ev-copy:focus-visible { border-color: var(--line2); color: var(--ink); }
  .card:not(.expanded) .ev-copy { display: none; }

  /* dossier relation lines */
  .ev-rel { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; line-height: 1.6; color: var(--ink3); overflow-wrap: anywhere; }

  /* relations ledger */
  .ledger-body { max-height: 340px; overflow: auto; margin-top: 10px; }
  .ledger-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .ledger-table th {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink3); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line2);
  }
  .ledger-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--ink2); vertical-align: top; }
  .ledger-table tbody tr { cursor: pointer; }
  .ledger-table tbody tr:hover td, .ledger-table tbody tr:focus-visible td { background: var(--bg); }
  .ledger-table td:nth-child(1), .ledger-table td:nth-child(5) { font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .ledger-hint { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin: 8px 0 0; }

  /* filter-bar extras */
  .f-right { margin-left: auto; display: flex; gap: 6px; }

  /* dossier (stacked reading) mode */
  body.dossier #stage { overflow: visible; height: auto; }
  body.dossier #sizer { width: auto !important; height: auto !important; margin: 0; }
  body.dossier #canvas { transform: none !important; width: auto !important; height: auto !important; position: static; }
  body.dossier #links { display: none; }
  body.dossier .col { position: static !important; left: auto !important; top: auto !important; width: auto !important; max-width: 720px; margin: 0 auto 16px; }
  body.dossier .col .card { width: auto !important; }
  body.dossier .card.has-desc::after { content: ""; }
  body.dossier .card:not(.expanded) .ev-desc,
  body.dossier .card:not(.expanded) .ev-sources,
  body.dossier .card:not(.expanded) .ev-meta { max-height: none; overflow: visible; }
  body.dossier .card:not(.expanded) .ev-split { display: grid; grid-template-columns: 1fr 1fr; }
  body.dossier .ev-rel { display: block; }
  body.dossier .bar { display: none; }

  .col.chain .card { border-color: var(--line2); }
  .card.focus { border-color: var(--ink3); }

  /* ---- svg elements ---- */
  .axisline { stroke: var(--spine); stroke-width: 1; }
  .tick { stroke: var(--line); stroke-width: 1; }
  .dot { fill: var(--card); stroke: var(--line2); stroke-width: 1.5; transition: opacity .2s ease; }
  .dot.active { stroke: var(--ink2); }
  .axdate {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    fill: var(--ink3);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
    transition: opacity .2s ease;
  }
  .dimmed { opacity: .15; }
  .lk {
    fill: none; stroke: var(--link); stroke-width: 1.4; opacity: .75;
    transition: stroke .2s ease, opacity .2s ease, stroke-width .2s ease;
  }
  .lk.infer { stroke-dasharray: 5 5; opacity: .5; }
  .lk.active { stroke: var(--link-strong); opacity: 1; stroke-width: 2; }
  .lklabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: .03em;
    fill: var(--ink3); text-anchor: middle;
    paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
    opacity: .9;
    transition: fill .2s ease, opacity .2s ease;
  }
  .lklabel.active { fill: var(--link-strong); opacity: 1; }

  /* ---- footer ---- */
  footer {
    margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  #legend { font-family: var(--mono); font-size: 11px; color: var(--ink3); letter-spacing: .02em; line-height: 1.7; }
  .credit { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink3); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    #stage { scroll-behavior: auto; }
  }

  @media print {
    @page { margin: 12mm; }
    .bar { display: none; }
    .filters { display: none; }
    main { padding-top: 8px; overflow: visible; }
    #stage { overflow: visible !important; height: auto !important; }
    #sizer { width: auto !important; height: auto !important; margin: 0; }
    #canvas { transform: none !important; width: auto !important; height: auto !important; position: static; }
    #links { display: none; }
    .col { position: static !important; left: auto !important; top: auto !important; width: auto !important; max-width: none; margin: 0 0 10pt; }
    .col .card { width: auto !important; }
    .card { box-shadow: none; break-inside: avoid; }
    .card.has-desc::after { content: ""; }
    .card:not(.expanded) .ev-desc,
    .card:not(.expanded) .ev-sources,
    .card:not(.expanded) .ev-meta { max-height: none !important; overflow: visible !important; }
    .card:not(.expanded) .ev-split { display: grid !important; grid-template-columns: 1fr 1fr; }
    .ev-rel { display: block !important; }
    .ev-copy { display: none !important; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="brand">Chronology <em>samajhiye</em></div>
    <div class="controls">
      <button id="pan-left" type="button" aria-label="Pan left">‹</button>
      <button id="pan-right" type="button" aria-label="Pan right">›</button>
      <span class="gap"></span>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-reset" type="button" aria-label="Reset zoom">100%</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <span class="gap"></span>
      <button id="theme" type="button" aria-label="Toggle light and dark theme">◐</button>
    </div>
  </div>
</header>

<main>
  <div class="head">
    <h1 id="title">Chronology</h1>
    <p id="subtitle" hidden></p>
  </div>

  <div class="filters" id="filters" hidden>
    <input id="q" type="search" placeholder="Filter events…  (press /)" aria-label="Filter events" autocomplete="off">
    <div class="pills" id="pills"></div>
    <button id="fclear" type="button" hidden>clear</button>
    <span class="fcount" id="fcount" aria-live="polite"></span>
    <span class="f-right">
      <button id="dossierBtn" type="button" title="Stacked reading view — good for printing">dossier</button>
      <button id="printBtn" type="button" title="Print or save as PDF">print</button>
    </span>
  </div>

  <div id="stage" tabindex="0" aria-label="Timeline — drag or scroll horizontally">
    <div id="sizer">
      <div id="canvas">
        <svg id="links" aria-hidden="true"></svg>
      </div>
    </div>
  </div>

  <details class="meth" id="meth">
    <summary>About this timeline — methodology &amp; audit</summary>
    <div class="meth-body" id="methBody"></div>
  </details>

  <details class="meth" id="ledger">
    <summary>Relations ledger — every link, audited</summary>
    <div class="ledger-body" id="ledgerBody"></div>
    <p class="ledger-hint">Click a row to flash its link on the timeline.</p>
  </details>

  <footer>
    <div id="legend"></div>

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var entities = Array.isArray(D.entities) ? D.entities : [];

  /* ---------- date display ---------- */

    if (counters.length) {

      var split = el("div", "ev-split");
      var sc1 = el("div", "ev-split-col");
      var sh1 = el("div", "ev-split-h");

      var sh2 = el("div", "ev-split-h");

  /* dossier relation lines (visible in dossier / print views) */
  events.forEach(function (ev) {

  /* copy citation */
  function citationText(s) {

    if (s.locator) parts.push("(" + s.locator + ")");

    var text = citationText(s) + " (accessed " + acc + ")";

  var hiId = null, selId = null, stepIdx = { out: 0, in: 0 };
  var fEntity = null, fTag = null, fText = "";

  function filterActive() { return fEntity !== null || fTag !== null || fText !== ""; }

    if (fTag !== null && (!Array.isArray(ev.tags) || ev.tags.indexOf(fTag) < 0)) return false;
    if (fText) {
      var hay = (ev.title || "") + " " + (ev.description || "") + " " + (ev.date_label || "");
      if (Array.isArray(ev.actors)) hay += " " + ev.actors.map(entName).join(" ");
      if (Array.isArray(ev.sources)) ev.sources.forEach(function (s) {
        hay += " " + (s && typeof s === "object" ? (s.label || "") + " " + (s.excerpt || "") : String(s || ""));
      });

    }

  }

  function doClear() {

    events.forEach(function (ev) { if (ev._card) ev._card.classList.remove("focus"); });

  }

  function applyFilter() {
    doClear();
    var count = document.getElementById("fcount");

    var shown = 0;
    colEls.forEach(function (c) {
      var ev = byId.get(c.dataset.id);
      var on = ev && matches(ev);
      if (on) shown++;
      c.classList.toggle("dim", !on);
    });
    allPaths().forEach(function (p) {
      var a = byId.get(p.dataset.from), b = byId.get(p.dataset.to);

    Array.prototype.forEach.call(svg.querySelectorAll(".dot, .axdate"), function (m) {
      var ev = byId.get(m.dataset.id);

  }

  function highlight(id) {

    if (me && me._card) me._card.classList.add("focus");

    Array.prototype.forEach.call(svg.querySelectorAll(".dot, .axdate"), function (m) {

    });
  }

  function unHi() { hiId = null; if (filterActive()) applyFilter(); else doClear(); }

  function toggleExpand(ev) {

  }

  /* ---------- layout ---------- */
  var PAD_X = 80, PAD_TOP = 44, PAD_BOTTOM = 30, GAP = 96;
  var COL_W = 340, CARD_W = 300;
  var metrics = { W: 0, H: 0, axisY: 0 };

  function layout() {
    if (!events.length) {

      canvas.style.height = "120px";

        msg.textContent = "No events in this timeline.";
        canvas.append(msg);
      }

    }

    CARD_W = window.matchMedia("(max-width: 760px)").matches ? 252 : 300;
    COL_W = CARD_W + 40;

    var n = events.length;
    var W = n * COL_W + 2 * PAD_X;

    var maxA = 40, maxB = 40;
    events.forEach(function (ev, i) {
      var col = ev._col;
      col.style.width = CARD_W + "px";
      ev._cx = PAD_X + COL_W * (i + 0.5);
      col.style.left = (ev._cx - CARD_W / 2) + "px";
      col.style.top = "0px";
      var h = col.offsetHeight;
      ev._h = h;
      if (ev._above) { if (h > maxA) maxA = h; }
      else { if (h > maxB) maxB = h; }
    });

    var axisY = PAD_TOP + maxA + GAP;
    var H = axisY + GAP + maxB + PAD_BOTTOM;

    canvas.style.height = H + "px";

  var lraf = 0;

  /* ---------- draw svg ---------- */
  function draw() {
    var W = metrics.W, H = metrics.H, axisY = metrics.axisY;
    if (!W || !H) return;

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.style.width = W + "px";
    svg.style.height = H + "px";

    var defs = document.createElementNS(NS, "defs");
    var marker = document.createElementNS(NS, "marker");
    marker.setAttribute("id", "arrowhead");
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "8");
    marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "7");
    marker.setAttribute("markerHeight", "7");

    marker.append(mp);
    defs.append(marker);

    var hatch = document.createElementNS(NS, "pattern");
    hatch.setAttribute("id", "hatch");
    hatch.setAttribute("patternUnits", "userSpaceOnUse");
    hatch.setAttribute("patternTransform", "rotate(45)");
    hatch.setAttribute("width", "7");
    hatch.setAttribute("height", "7");
    var hline = document.createElementNS(NS, "line");
    hline.setAttribute("x1", "0"); hline.setAttribute("y1", "0");
    hline.setAttribute("x2", "0"); hline.setAttribute("y2", "7");
    hline.setAttribute("class", "hatchline");
    hatch.append(hline);
    defs.append(hatch);

    svg.append(defs);

    function line(x1, y1, x2, y2, cls) {
      var l = document.createElementNS(NS, "line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1);
      l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      l.setAttribute("class", cls);
      return l;
    }

    // axis
    svg.append(line(0, axisY, W, axisY, "axisline"));

    // silent-period ribbons (hatched bands between distant events)
    (function () {
      var pairs = [];
      for (var i = 1; i < events.length; i++) {
        var a = dateVal(events[i - 1].start), b = dateVal(events[i].start);
        if (a == null || b == null || b < a) continue;
        pairs.push({ i: i, years: b - a, manual: events[i].gap_before || null });
      }
      var years = pairs.map(function (p) { return p.years; }).sort(function (x, y) { return x - y; });
      var median = years.length ? years[Math.floor(years.length / 2)] : 0;
      var threshold = Math.max(2 * median, 120 / 365.25);
      var marked = pairs.filter(function (p) { return p.years > threshold || p.manual; });
      var mans = marked.filter(function (p) { return !!p.manual; });
      var autos = marked.filter(function (p) { return !p.manual; });
      autos.sort(function (x, y) { return y.years - x.years; });
      autos = autos.slice(0, Math.max(0, 6 - mans.length));
      marked = mans.concat(autos);
      marked.sort(function (x, y) { return x.i - y.i; });
      marked.forEach(function (p) {
        var x1 = events[p.i - 1]._cx + 16, x2 = events[p.i]._cx - 16;
        if (x2 - x1 < 44) return;
        var rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", x1);
        rect.setAttribute("y", axisY - 8);
        rect.setAttribute("width", x2 - x1);
        rect.setAttribute("height", 16);
        rect.setAttribute("rx", "3");
        rect.setAttribute("fill", "url(#hatch)");
        rect.setAttribute("class", "gapband");
        svg.append(rect);
        var label = (p.manual && p.manual.label) ? String(p.manual.label) : "no recorded events · " + fmtGap(p.years);
        var t = document.createElementNS(NS, "text");
        t.setAttribute("x", (x1 + x2) / 2);
        t.setAttribute("y", axisY + 3.5);
        t.setAttribute("class", "gaplabel");
        t.setAttribute("text-anchor", "middle");
        t.textContent = "// " + label + " //";
        svg.append(t);
      });
    })();

    // ticks, dots, axis dates
    events.forEach(function (ev) {
      var cx = ev._cx;
      var edgeY = ev._above ? axisY - GAP : axisY + GAP;
      svg.append(line(cx, edgeY, cx, axisY, "tick"));

      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx);
      dot.setAttribute("cy", axisY);
      dot.setAttribute("r", "3.5");
      dot.setAttribute("class", "dot");
      dot.dataset.id = ev.id;
      svg.append(dot);

      var t = document.createElementNS(NS, "text");
      t.setAttribute("x", cx + 9);
      t.setAttribute("y", ev._above ? axisY + 20 : axisY - 9);
      t.setAttribute("class", "axdate");
      t.textContent = axisDate(ev);
      t.dataset.id = ev.id;
      svg.append(t);
    });

    // causal links — lane-routed, perpendicular into card edges
    links.forEach(function (ln, k) {
      if (!valid(ln)) return;
      var a = byId.get(ln.from), b = byId.get(ln.to);
      var p1x = a._cx, p1y = a._above ? axisY - GAP : axisY + GAP;
      var p2x = b._cx, p2y = b._above ? axisY - GAP : axisY + GAP;
      var side = a._above ? -1 : 1;
      var laneY = axisY + side * (16 + (k % 6) * 9);

      var d = "M " + p1x + " " + p1y +
              " C " + p1x + " " + laneY +
              ", " + p2x + " " + laneY +
              ", " + p2x + " " + p2y;

      var path = document.createElementNS(NS, "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "lk" + (infer(ln) ? " infer" : ""));
      path.setAttribute("marker-end", "url(#arrowhead)");
      path.dataset.from = ln.from;
      path.dataset.to = ln.to;
      path.dataset.lid = k;
      svg.append(path);

      var len = path.getTotalLength();
      var pt = path.getPointAtLength(len * 0.5);
      // keep link labels out of the axis band (gap ribbons) and the axis-date row
      var ty = pt.y - 6;
      if (ty > axisY - 20 && ty < axisY + 26) ty = (pt.y > axisY + 6) ? axisY + 30 : axisY - 16;
      var t = document.createElementNS(NS, "text");
      t.setAttribute("x", pt.x);
      t.setAttribute("y", ty);
      t.setAttribute("class", "lklabel");
      t.textContent = ln.label || "led to";
      t.dataset.from = ln.from;
      t.dataset.to = ln.to;
      t.dataset.lid = k;
      svg.append(t);
    });
  }

  /* ---------- zoom ---------- */
  var zoom = 1;
  var zoomLabel = document.getElementById("zoom-reset");
  function applyZoom(z) {
    zoom = Math.min(1.4, Math.max(0.5, Math.round(z * 10) / 10));
    canvas.style.transform = zoom === 1 ? "" : "scale(" + zoom + ")";
    if (metrics.W) {
      sizer.style.width = (metrics.W * zoom) + "px";
      sizer.style.height = (metrics.H * zoom) + "px";
    }
    zoomLabel.textContent = Math.round(zoom * 100) + "%";
  }
  document.getElementById("zoom-in").addEventListener("click", function () { applyZoom(zoom + 0.1); });
  document.getElementById("zoom-out").addEventListener("click", function () { applyZoom(zoom - 0.1); });
  zoomLabel.addEventListener("click", function () { applyZoom(1); });

  /* ---------- pan: drag, wheel, buttons, keys ---------- */
  var dragSL = 0, dragX = 0, dragging = false, dragMoved = false;

  function onDragMove(e) {
    if (!dragging) return;
    var dx = e.clientX - dragX;
    if (!dragMoved && Math.abs(dx) > 5) { dragMoved = true; stage.classList.add("dragging"); }
    if (dragMoved) stage.scrollLeft = dragSL - dx;
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove("dragging");
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);
  }
  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest("a, button, input, select, textarea")) return;
    dragging = true;
    dragMoved = false;
    dragX = e.clientX;
    dragSL = stage.scrollLeft;
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
  });
  stage.addEventListener("click", function (e) {
    if (dragMoved) { e.stopPropagation(); e.preventDefault(); dragMoved = false; }
  }, true);

  stage.addEventListener("wheel", function (e) {
    var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (!d) return;
    var before = stage.scrollLeft;
    stage.scrollLeft = before + d;
    if (stage.scrollLeft !== before) e.preventDefault();
  }, { passive: false });

  document.getElementById("pan-left").addEventListener("click", function () {
    stage.scrollBy({ left: -stage.clientWidth * 0.8, behavior: reduceMotion ? "auto" : "smooth" });
  });
  document.getElementById("pan-right").addEventListener("click", function () {
    stage.scrollBy({ left: stage.clientWidth * 0.8, behavior: reduceMotion ? "auto" : "smooth" });
  });
  stage.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { stage.scrollLeft += 120; e.preventDefault(); }
    if (e.key === "ArrowLeft") { stage.scrollLeft -= 120; e.preventDefault(); }
  });

  /* ---------- theme ---------- */
  document.getElementById("theme").addEventListener("click", function () {
    var t = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = t;
    try { localStorage.setItem("cs-theme", t); } catch (e) {}
  });

  /* ---------- filters: search, cast pills, tag pills ---------- */
  var filtersEl = document.getElementById("filters");
  var qInput = document.getElementById("q");
  var pillsEl = document.getElementById("pills");
  var clearBtn = document.getElementById("fclear");

  var tagList = [];
  events.forEach(function (ev) {
    if (Array.isArray(ev.tags)) ev.tags.forEach(function (t) {
      if (t != null && tagList.indexOf(String(t)) < 0) tagList.push(String(t));
    });
  });

  function syncPills() {
    Array.prototype.forEach.call(pillsEl.querySelectorAll(".pill"), function (b) {
      var on = b.dataset.kind === "entity" ? b.dataset.id === fEntity : b.dataset.id === fTag;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    clearBtn.hidden = !filterActive();
  }

  function makePill(kind, id, text, title) {
    var b = el("button", "pill");
    b.type = "button";
    b.dataset.kind = kind;
    b.dataset.id = id;
    b.textContent = text;
    b.title = title;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () {
      if (kind === "entity") fEntity = (fEntity === id) ? null : id;
      else fTag = (fTag === id) ? null : id;
      syncPills();
      applyFilter();
    });
    return b;
  }

  if (events.length) filtersEl.hidden = false;

  entities.forEach(function (en) {
    if (!en || en.id == null) return;
    var n = events.filter(function (ev) { return Array.isArray(ev.actors) && ev.actors.map(String).indexOf(String(en.id)) >= 0; }).length;
    if (!n) return;
    pillsEl.append(makePill("entity", String(en.id), en.name || String(en.id), (en.role ? en.role + " — " : "") + n + " event" + (n === 1 ? "" : "s")));
  });
  tagList.forEach(function (t) {
    var n = events.filter(function (ev) { return Array.isArray(ev.tags) && ev.tags.indexOf(t) >= 0; }).length;
    pillsEl.append(makePill("tag", t, "#" + t, n + " event" + (n === 1 ? "" : "s")));
  });

  var matchList = [], matchIdx = 0;
  function goNextMatch() {
    matchList = events.filter(matches);
    if (!matchList.length) return;
    var ev = matchList[matchIdx % matchList.length];
    matchIdx++;
    stage.scrollTo({ left: Math.max(0, ev._cx * zoom - stage.clientWidth / 2), behavior: reduceMotion ? "auto" : "smooth" });
  }

  if (qInput) {
    qInput.addEventListener("input", function () {
      fText = qInput.value.trim().toLowerCase();
      matchIdx = 0;
      clearBtn.hidden = !filterActive();
      applyFilter();
    });
    qInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); goNextMatch(); }
      if (e.key === "Escape") {
        fEntity = null; fTag = null; fText = ""; qInput.value = "";
        syncPills();
        applyFilter();
      }
    });
  }
  clearBtn.addEventListener("click", function () {
    fEntity = null; fTag = null; fText = "";
    if (qInput) qInput.value = "";
    syncPills();
    applyFilter();
  });

  /* ---------- methodology & audit drawer ---------- */
  var metaInfo = D.meta && typeof D.meta === "object" ? D.meta : {};
  var solid = links.filter(function (l) { return valid(l) && !infer(l); }).length;
  var dashed = links.filter(function (l) { return valid(l) && infer(l); }).length;
  (function () {
    var body = document.getElementById("methBody");
    if (!body) return;
    var sourced = events.filter(function (ev) { return Array.isArray(ev.sources) && ev.sources.length; }).length;
    var pct = Math.round((sourced / Math.max(1, events.length)) * 100);
    var flagged = events.filter(function (ev) { var s = String(ev.status || "").toLowerCase(); return s === "alleged" || s === "disputed"; }).length;
    var countered = events.filter(function (ev) { return Array.isArray(ev.counter_sources) && ev.counter_sources.length; }).length;
    var auditLine = events.length + " events · " + sourced + " sourced (" + pct + "%) · " + solid + " stated / " + dashed + " inferred links";
    if (flagged) auditLine += " · " + flagged + " alleged/disputed";
    if (countered) auditLine += " · " + countered + " with counter-sources";
    var audit = el("p", "meth-audit");
    audit.textContent = auditLine;
    body.append(audit);
    if (metaInfo.methodology) {
      var m1 = el("p", "meth-note");
      m1.textContent = metaInfo.methodology;
      body.append(m1);
    }
    if (metaInfo.extraction_notes) {
      var m2 = el("p", "meth-note");
      m2.textContent = metaInfo.extraction_notes;
      body.append(m2);
    }
    if (Array.isArray(metaInfo.alternative_hypotheses) && metaInfo.alternative_hypotheses.length) {
      var mh = el("p", "meth-h");
      mh.textContent = "Alternative interpretations considered";
      body.append(mh);
      var ul = el("ul");
      metaInfo.alternative_hypotheses.forEach(function (h) {
        var li = el("li");
        li.textContent = String(h);
        ul.append(li);
      });
      body.append(ul);
    }
    if (metaInfo.last_verified) {
      var m3 = el("p", "meth-note");
      m3.textContent = "Sources last verified: " + metaInfo.last_verified;
      body.append(m3);
    }
  })();

  /* ---------- legend ---------- */
  document.getElementById("legend").textContent =
    events.length + " events · " + (solid + dashed) + " links — solid: stated cause · dashed: inferred · hatched band: quiet stretch · / filters · drag to travel · hover lights its direct links · click a card, then [ ] steps its chain";

  /* ---------- relations ledger ---------- */
  (function () {
    var lbody = document.getElementById("ledgerBody");
    if (!lbody) return;
    var rows = [];
    links.forEach(function (ln, li) {
      if (!valid(ln)) return;
      rows.push({ li: li, ln: ln, a: byId.get(ln.from), b: byId.get(ln.to) });
    });
    if (!rows.length) {
      var dl = document.getElementById("ledger");
      if (dl) dl.remove();
      return;
    }
    var tbl = el("table", "ledger-table");
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    ["#", "Cause (from)", "Relation", "Effect (to)", "Confidence"].forEach(function (ht) {
      var th = document.createElement("th");
      th.textContent = ht;
      trh.append(th);
    });
    thead.append(trh);
    tbl.append(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      tr.tabIndex = 0;
      var td1 = document.createElement("td"); td1.textContent = String(i + 1);
      var td2 = document.createElement("td"); td2.textContent = r.a.title || r.a.id;
      var td3 = document.createElement("td"); td3.textContent = r.ln.label || "led to";
      var td4 = document.createElement("td"); td4.textContent = r.b.title || r.b.id;
      var td5 = document.createElement("td");
      td5.textContent = (typeof r.ln.confidence === "number" ? r.ln.confidence.toFixed(2) : "—") + (infer(r.ln) ? " · inferred" : "");
      tr.append(td1, td2, td3, td4, td5);
      var go = function () { flashLink(r.li); };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      tbody.append(tr);
    });
    tbl.append(tbody);
    lbody.append(tbl);
  })();

  var flashTimer = null;
  function flashLink(li) {
    var ln = links[li];
    if (!ln) return;
    var a = byId.get(ln.from), b = byId.get(ln.to);
    Array.prototype.forEach.call(svg.querySelectorAll(".lk.active, .lklabel.active"), function (p) { p.classList.remove("active"); });
    var els = svg.querySelectorAll('.lk[data-lid="' + li + '"], .lklabel[data-lid="' + li + '"]');
    Array.prototype.forEach.call(els, function (p) { p.classList.add("active"); });
    if (a && b) stage.scrollTo({ left: Math.max(0, ((a._cx + b._cx) / 2) * zoom - stage.clientWidth / 2), behavior: reduceMotion ? "auto" : "smooth" });
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      Array.prototype.forEach.call(els, function (p) { p.classList.remove("active"); });
    }, 2200);
  }

  /* ---------- dossier / print ---------- */
  var dossierBtn = document.getElementById("dossierBtn");
  if (dossierBtn) {
    dossierBtn.addEventListener("click", function () {
      var on = !document.body.classList.contains("dossier");
      document.body.classList.toggle("dossier", on);
      dossierBtn.classList.toggle("active", on);
      if (on) { window.scrollTo({ top: 0 }); } else { scheduleLayout(); }
    });
  }
  var printBtn = document.getElementById("printBtn");
  if (printBtn) printBtn.addEventListener("click", function () { window.print(); });
  window.addEventListener("beforeprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; });
  });

  /* ---------- deep links (#event-id) ---------- */
  function jumpToHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    var ev = byId.get(decodeURIComponent(h));
    if (!ev || !ev._card) return;
    stage.scrollTo({ left: Math.max(0, ev._cx * zoom - stage.clientWidth / 2), behavior: "auto" });
    try { ev._card.focus({ preventScroll: true }); } catch (e) { ev._card.focus(); }
  }
  window.addEventListener("hashchange", jumpToHash);

  /* ---------- init ---------- */
  layout();
  jumpToHash();
  updateHops();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
  window.addEventListener("resize", scheduleLayout);
})();
</script>
</body>
</html>
