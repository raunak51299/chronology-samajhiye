<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronology</title>

<script>
(function () {
  try {
    var t = localStorage.getItem("cs-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "light"; }
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --ink: #191919;
    --ink2: #55555a;
    --ink3: #98989b;
    --line: #e0e0dd;
    --line2: #c6c6c3;
    --spine: #c9c9c6;
    --link: #8f8f8c;
    --link-strong: #333330;
    --shadow: 0 1px 2px rgba(20,20,20,.05), 0 10px 28px -14px rgba(20,20,20,.18);
    --era: #ededeb;
    --era2: #f3f3f1;
    --era-line: #e6e6e3;
    --serif: "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #101010;
    --card: #1a1a1a;
    --ink: #f1f1ef;
    --ink2: #b4b4b1;
    --ink3: #77777a;
    --line: #2b2b2b;
    --line2: #3d3d3d;
    --spine: #353533;
    --link: #6c6c6a;
    --link-strong: #dcdcda;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.7);
    --era: #151515;
    --era2: #181818;
    --era-line: #262626;
    color-scheme: dark;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  ::selection { background: var(--line2); }

  /* ---- top bar ---- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 30%, transparent);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid color-mix(in srgb, var(--line2) 40%, transparent);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .32),
      0 1px 12px -6px rgba(20, 20, 20, .12);
  }
  [data-theme="dark"] .bar {
    background: color-mix(in srgb, var(--bg) 34%, transparent);
    border-bottom-color: color-mix(in srgb, var(--line2) 60%, transparent);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .07),
      0 1px 12px -6px rgba(0, 0, 0, .5);
  }
  .bar-inner {
    max-width: 1180px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--serif); font-size: 14px; letter-spacing: .06em; color: var(--ink2); white-space: nowrap; }
  .brand em { color: var(--ink3); }
  .controls { display: flex; gap: 6px; margin-left: auto; }
  .controls button {
    font-family: var(--mono); font-size: 12px; min-width: 30px; height: 28px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .controls button:hover { border-color: var(--line2); color: var(--ink); }
  .controls .gap { width: 14px; }

  /* ---- page ---- */
  main { max-width: 1180px; margin: 0 auto; padding: 44px 20px 64px; overflow-x: clip; }
  .head { margin-bottom: 38px; text-align: center; }
  #title {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(26px, 4vw, 40px); letter-spacing: -.01em; line-height: 1.15;
    margin: 0;
  }
  #subtitle {
    margin: 12px auto 0; max-width: 660px;
    color: var(--ink2); font-size: 15px; line-height: 1.55;
  }

  /* ---- horizontal stage ---- */
  #stage {
    position: relative;
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    outline: none;
  }
  #stage.dragging { cursor: grabbing; user-select: none; }
  #stage:focus-visible { outline: 2px solid var(--line2); outline-offset: 6px; border-radius: 6px; }
  #stage::-webkit-scrollbar { height: 9px; }
  #stage::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; }
  #stage::-webkit-scrollbar-track { background: transparent; }

  #sizer { position: relative; margin: 0 auto; }
  #canvas { position: absolute; top: 0; left: 0; transform-origin: top left; }

  #links { position: absolute; top: 0; left: 0; z-index: 0; overflow: visible; pointer-events: none; }

  .col { position: absolute; z-index: 1; transition: opacity .25s ease; }
  .col.dim { opacity: .2; }
  .col.expanded { z-index: 6; }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    cursor: pointer; outline: none;
    transition: border-color .2s ease, opacity .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .card:hover, .card:focus-visible { border-color: var(--line2); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--line2); outline-offset: 2px; }
  .card.has-desc::after {
    content: "+"; position: absolute; top: 10px; right: 13px;
    font-family: var(--mono); font-size: 13px; color: var(--ink3);
  }
  .card.has-desc.expanded::after { content: "–"; }

  .ev-date { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink3); }
  .ev-title { font-size: 14.5px; font-weight: 600; line-height: 1.35; margin: 5px 0 0; color: var(--ink); }
  .ev-desc { display: none; margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink2); }
  .card.expanded .ev-desc { display: block; }
  .card.expanded { border-color: var(--line2); max-height: 460px; overflow-y: auto; }
  body.dossier .card.expanded { max-height: none; overflow: visible; }

  .ev-sources { margin-top: 9px; font-size: 11px; line-height: 1.7; color: var(--ink3); }
  .ev-src-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink3); margin-right: 7px;
  }
  .ev-src { color: var(--ink2); }
  a.ev-src { text-decoration: underline dotted; text-underline-offset: 2px; }
  a.ev-src:hover { color: var(--ink); }
  .ev-src + .ev-src::before { content: "·"; margin: 0 7px; color: var(--ink3); }
  .card:not(.expanded) .ev-sources { max-height: 1.8em; overflow: hidden; }

  .ev-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 7px; }
  .card:not(.expanded) .ev-meta { max-height: 1.9em; overflow: hidden; }
  .ev-actor, .ev-tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .02em;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
    color: var(--ink2); white-space: nowrap;
  }
  .ev-tag { color: var(--ink3); }

  .ev-quote {
    margin: 9px 0 0; padding: 1px 0 1px 10px;
    border-left: 2px solid var(--line2);
    font-family: var(--serif); font-style: italic; font-size: 12.5px; line-height: 1.5; color: var(--ink2);
  }
  .ev-quote-attr {
    display: block; margin-top: 3px;
    font-family: var(--mono); font-style: normal; font-size: 9.5px; color: var(--ink3);
  }

  .ev-src-item { margin-top: 5px; }
  .ev-src-tier {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--ink3);
  }
  a.ev-src-arch { font-size: 10px; margin-left: 6px; color: var(--ink3); text-decoration: underline dotted; text-underline-offset: 2px; }
  a.ev-src-arch:hover { color: var(--ink); }
  .ev-src-excerpt { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.5; color: var(--ink3); }
  .ev-src-excerpt::before { content: "\201C"; }
  .ev-src-excerpt::after { content: "\201D"; }
  .ev-src-loc { font-size: 9.5px; color: var(--ink3); }
  .ev-src, a.ev-src { overflow-wrap: anywhere; }

  .gapband { stroke: var(--line2); stroke-width: 1; }
  .hatchline { stroke: var(--line2); stroke-width: 1; }
  .gaplabel {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .03em;
    fill: var(--ink3);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  }
  .lk.dimmed, .lklabel.dimmed { opacity: .15; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 20px; }
  .filters[hidden] { display: none; }
  #q {
    font-family: var(--mono); font-size: 12px; height: 30px; padding: 0 10px;
    width: 230px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); outline: none;
  }
  #q:focus-visible { border-color: var(--line2); outline: 2px solid var(--line2); outline-offset: 1px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-family: var(--mono); font-size: 11px; padding: 4px 11px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .pill:hover { border-color: var(--line2); color: var(--ink); }
  .pill.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .fcount { font-family: var(--mono); font-size: 11px; color: var(--ink3); }
  #fclear {
    font-family: var(--mono); font-size: 11px; background: none; border: none;
    color: var(--ink3); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px;
  }
  #fclear:hover { color: var(--ink); }
  #fclear[hidden] { display: none; }
  #dossierBtn, #printBtn {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink2); cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  #dossierBtn:hover, #printBtn:hover { border-color: var(--line2); color: var(--ink); }
  #dossierBtn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .meth { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .meth summary {
    cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    color: var(--ink3); text-transform: uppercase;
  }
  .meth summary:hover { color: var(--ink2); }
  .meth-body { max-width: 760px; font-size: 12.5px; line-height: 1.65; color: var(--ink2); }
  .meth-audit { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin: 10px 0 0; }
  .meth-note { margin: 8px 0 0; }
  .meth-h { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin: 12px 0 0; }
  .meth-body ul { margin: 6px 0 0; padding-left: 18px; }

  .ev-desc, .ev-title { overflow-wrap: anywhere; }

  /* ---- phase 2: epistemic status ---- */
  .ev-top { display: flex; align-items: center; gap: 8px; padding-right: 20px; }
  .ev-top .ev-date { flex: 1 1 auto; }
  .ev-hop {
    position: absolute; top: 1px; left: 16px; z-index: 2;
    font-family: var(--mono); font-size: 9px; line-height: 1; letter-spacing: .04em; color: var(--ink3);
    background: var(--card); border: 1px dashed var(--line2); border-radius: 4px; padding: 1px 4px; white-space: nowrap;
  }
  .ev-hop.root { border-style: solid; border-color: var(--ink2); color: var(--ink2); }
  .ev-status {
    flex: 0 0 auto; font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  }
  .ev-status.proven { background: var(--ink); border: 1px solid var(--ink); color: var(--bg); }
  .ev-status.corroborated { border: 1px solid var(--line2); color: var(--ink2); }
  .ev-status.inferred { border: 1px dashed var(--line2); color: var(--ink3); font-style: italic; }
  .ev-status.alleged { border: 3px double var(--line2); color: var(--ink2); }
  .ev-status.disputed { border: 1px solid var(--ink2); color: var(--ink2); }
  .card.status-proven { border: 1.5px solid var(--ink); }
  .card.status-corroborated { border-color: var(--line2); }
  .card.status-inferred { border-style: dashed; border-color: var(--line2); }
  .card.status-alleged { border: 3px double var(--line2); }
  .card.status-disputed { border-color: var(--ink2); }
  .card.status-disputed::before {
    content: ""; position: absolute; top: -1px; left: -1px; right: -1px; height: 6px;
    border-radius: 14px 14px 0 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, var(--ink3) 0 1px, transparent 1px 5px);
  }

  /* claim vs counter-claim */
  .ev-split { display: none; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card.expanded .ev-split { display: grid; grid-template-columns: 1fr 1fr; }
  .ev-split-col { padding: 7px 9px; min-width: 0; }
  .ev-split-col + .ev-split-col { border-left: 1px solid var(--line); }
  .ev-split-h { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 4px; }
  .ev-split-item { font-size: 10.5px; line-height: 1.5; color: var(--ink2); overflow-wrap: anywhere; }
  .ev-split-item + .ev-split-item { margin-top: 4px; }

  /* copy citation */
  .ev-copy {
    display: block; margin-top: 6px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    border: 1px solid var(--line); border-radius: 4px; background: none; color: var(--ink3);
    padding: 1px 6px; cursor: pointer;
  }
  .ev-copy:hover, .ev-copy:focus-visible { border-color: var(--line2); color: var(--ink); }
  .card:not(.expanded) .ev-copy { display: none; }

  /* dossier relation lines */
  .ev-rel { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; line-height: 1.6; color: var(--ink3); overflow-wrap: anywhere; }

  /* relations ledger */
  .ledger-body { max-height: 340px; overflow: auto; margin-top: 10px; }
  .ledger-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .ledger-table th {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink3); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line2);
  }
  .ledger-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--ink2); vertical-align: top; }
  .ledger-table tbody tr { cursor: pointer; }
  .ledger-table tbody tr:hover td, .ledger-table tbody tr:focus-visible td { background: var(--bg); }
  .ledger-table td:nth-child(1), .ledger-table td:nth-child(5) { font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .ledger-hint { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin: 8px 0 0; }

  /* filter-bar extras */
  .f-right { margin-left: auto; display: flex; gap: 6px; }

  /* dossier (stacked reading) mode */
  body.dossier #stage { overflow: visible; height: auto; }
  body.dossier #sizer { width: auto !important; height: auto !important; margin: 0; }
  body.dossier #canvas { transform: none !important; width: auto !important; height: auto !important; position: static; }
  body.dossier #links { display: none; }
  body.dossier .col { position: static !important; left: auto !important; top: auto !important; width: auto !important; max-width: 720px; margin: 0 auto 16px; }
  body.dossier .col .card { width: auto !important; }
  body.dossier .card.has-desc::after { content: ""; }
  body.dossier #canvas .card .ev-desc { display: block !important; }
  body.dossier #canvas .card .ev-meta { display: flex !important; }
  body.dossier #canvas .card .ev-quote { display: block !important; }
  body.dossier #canvas .card .ev-sources { display: block !important; }
  body.dossier #canvas .card .ev-date { display: inline !important; }
  body.dossier #canvas .card .ev-status { display: revert !important; }
  body.dossier #canvas .card .ev-title { white-space: normal; overflow: visible; text-overflow: clip; }
  body.dossier .card:not(.expanded) .ev-desc,
  body.dossier .card:not(.expanded) .ev-sources,
  body.dossier .card:not(.expanded) .ev-meta { max-height: none; overflow: visible; }
  body.dossier .card:not(.expanded) .ev-split { display: grid; grid-template-columns: 1fr 1fr; }
  body.dossier .ev-rel { display: block; }
  body.dossier .bar { display: none; }
  body.dossier .scalemode { display: none; }

  .col.chain .card { border-color: var(--line2); }
  .card.focus { border-color: var(--ink3); }

  /* ---- svg elements ---- */
  .axisline { stroke: var(--spine); stroke-width: 1; }
  .tick { stroke: var(--line); stroke-width: 1; }
  .dot { fill: var(--card); stroke: var(--line2); stroke-width: 1.5; transition: opacity .2s ease; }
  .dot.active { stroke: var(--ink2); }
  .axdate {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    fill: var(--ink3);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
    transition: opacity .2s ease;
  }
  .dimmed { opacity: .15; }
  .lk {
    fill: none; stroke: var(--link); stroke-width: 1.4; opacity: .75;
    transition: stroke .2s ease, opacity .2s ease, stroke-width .2s ease;
  }
  .lk.infer { stroke-dasharray: 5 5; opacity: .5; }
  .lk.active { stroke: var(--link-strong); opacity: 1; stroke-width: 2; }
  .lklabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: .03em;
    fill: var(--ink3); text-anchor: middle;
    paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
    opacity: .9;
    transition: fill .2s ease, opacity .2s ease;
  }
  .lklabel.active { fill: var(--link-strong); opacity: 1; }
  .lklabel.lklabel-hidden { opacity: 0; }
  .lklabel.lklabel-hidden.active { opacity: 1; }

  /* ---- footer ---- */
  footer {
    margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  #legend { font-family: var(--mono); font-size: 11px; color: var(--ink3); letter-spacing: .02em; line-height: 1.7; }
  .credit { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink3); }

  /* ---- scale mode, level of detail, time axis, eras ---- */
  .scalemode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .scalemode button {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    padding: 4px 9px; border: 0; background: var(--card); color: var(--ink3); cursor: pointer;
  }
  .scalemode button + button { border-left: 1px solid var(--line); }
  .scalemode button:hover { color: var(--ink); }
  .scalemode button.active { background: var(--ink); color: var(--bg); }

  #canvas.lod-compact .ev-hop,
  #canvas.lod-compact .ev-meta,
  #canvas.lod-compact .ev-sources,
  #canvas.lod-compact .ev-quote,
  #canvas.lod-compact .ev-desc { display: none; }
  #canvas.lod-overview .ev-date,
  #canvas.lod-overview .ev-status,
  #canvas.lod-overview .ev-hop,
  #canvas.lod-overview .ev-meta,
  #canvas.lod-overview .ev-sources,
  #canvas.lod-overview .ev-quote,
  #canvas.lod-overview .ev-desc { display: none; }
  #canvas.lod-overview .ev-title { font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #canvas.lod-compact .ev-title { font-size: 13px; }
  #canvas.lod-overview .card,
  #canvas.lod-compact .card { padding: 9px 12px; }
  #canvas.lod-overview .card { border-radius: 999px; }
  #canvas.lod-overview .card.has-desc::after,
  #canvas.lod-compact .card.has-desc::after { content: ""; }
  #canvas.lod-overview .lklabel,
  #canvas.lod-compact .lklabel { display: none; }

  .stem { stroke: var(--line2); stroke-width: 1; }
  .ttick { stroke: var(--line2); stroke-width: 1; }
  .ttick-label {

        if (url && /^https?:\/\//i.test(url)) {
          item = el("a", "ev-src");
          item.href = url;
          item.target = "_blank";
          item.rel = "noopener noreferrer";
        } else {
          item = el("span", "ev-src");
        }
        item.textContent = label;
        if (!rich) { sd.append(item); return; }
        var row = el("div", "ev-src-item");
        row.append(item);
        if (typeof s === "object") {
          if (s.source_tier) {
            var tier = el("span", "ev-src-tier");
            tier.textContent = String(s.source_tier).replace(/_/g, " ");
            row.append(tier);
          }
          if (s.archive_url && /^https?:\/\//i.test(s.archive_url)) {
            var arch = el("a", "ev-src-arch");
            arch.href = s.archive_url;
            arch.target = "_blank";
            arch.rel = "noopener noreferrer";
            arch.textContent = "archived copy";
            row.append(arch);
          }
          if (s.excerpt) {
            var ex = el("span", "ev-src-excerpt");
            ex.textContent = s.excerpt;
            if (s.locator) {
              var loc = el("span", "ev-src-loc");
              loc.textContent = "  · " + s.locator;
              ex.append(loc);
            }
            row.append(ex);
          } else if (s.locator) {
            var loc2 = el("span", "ev-src-loc");
            loc2.textContent = "  · " + s.locator;
            row.append(loc2);
          }
        }
        var cp = el("button", "ev-copy");
        cp.type = "button";
        cp.textContent = "copy citation";
        cp.addEventListener("click", function (e) {
          e.stopPropagation();
          copyCitation(s, cp);
        });
        row.append(cp);
        sd.append(row);
      });
      card.append(sd);
    }

    var counters = (Array.isArray(ev.counter_sources) ? ev.counter_sources : []).filter(Boolean);
    if (counters.length) {
      card.classList.add("has-desc");
      var split = el("div", "ev-split");
      var sc1 = el("div", "ev-split-col");
      var sh1 = el("div", "ev-split-h");
      sh1.textContent = "Claim";
      sc1.append(sh1);
      if (srcs.length) {
        srcs.forEach(function (s2) {
          var it = el("div", "ev-split-item");
          it.textContent = s2 && typeof s2 === "object" ? (s2.label || s2.url || "") : String(s2 || "");
          sc1.append(it);
        });
      } else {
        var none1 = el("div", "ev-split-item");
        none1.textContent = "—";
        sc1.append(none1);
      }
      var sc2 = el("div", "ev-split-col");
      var sh2 = el("div", "ev-split-h");
      sh2.textContent = "Counter-claim";
      sc2.append(sh2);
      counters.forEach(function (s3) {
        var it2 = el("div", "ev-split-item");
        it2.textContent = s3 && typeof s3 === "object" ? (s3.label || s3.url || "") : String(s3 || "");
        sc2.append(it2);
      });
      split.append(sc1);
      split.append(sc2);
      card.append(split);
    }

    col.append(card);
    canvas.append(col);
    ev._col = col;
    ev._card = card;
    byId.set(ev.id, ev);
  });

  // relations index (for dossier lines + ledger)
  var relIn = new Map(), relOut = new Map();
  links.forEach(function (ln) {
    if (!ln || ln.from == null || ln.to == null) return;
    if (!relOut.has(ln.from)) relOut.set(ln.from, []);
    relOut.get(ln.from).push(ln);
    if (!relIn.has(ln.to)) relIn.set(ln.to, []);
    relIn.get(ln.to).push(ln);
  });

  var colEls = Array.prototype.slice.call(canvas.querySelectorAll(".col"));

  /* ---------- links graph ---------- */
  function valid(ln) { return ln && byId.has(ln.from) && byId.has(ln.to); }
  function infer(ln) { return typeof ln.confidence === "number" && ln.confidence < 0.65; }

  var outMap = new Map(), inMap = new Map();
  links.forEach(function (ln) {
    if (!valid(ln)) return;
    if (!outMap.has(ln.from)) outMap.set(ln.from, []);
    outMap.get(ln.from).push(ln.to);
    if (!inMap.has(ln.to)) inMap.set(ln.to, []);
    inMap.get(ln.to).push(ln.from);
  });

  function neighborsOf(start) {
    var near = new Set([start]);
    (outMap.get(start) || []).forEach(function (m) { near.add(m); });
    (inMap.get(start) || []).forEach(function (m) { near.add(m); });
    return near;
  }

  function allPaths() { return Array.prototype.slice.call(svg.querySelectorAll(".lk, .lklabel")); }

  function updateHops() {
    var up = new Map(), down = new Map();
    if (selId != null && byId.has(selId)) {
      var q1 = [[selId, 0]], seenU = new Set([selId]);
      while (q1.length) {
        var cur1 = q1.shift();
        (inMap.get(cur1[0]) || []).forEach(function (m) {
          if (!seenU.has(m) && byId.has(m)) { seenU.add(m); up.set(m, cur1[1] + 1); q1.push([m, cur1[1] + 1]); }
        });
      }
      var q2 = [[selId, 0]], seenD = new Set([selId]);
      while (q2.length) {
        var cur2 = q2.shift();
        (outMap.get(cur2[0]) || []).forEach(function (m) {
          if (!seenD.has(m) && byId.has(m)) { seenD.add(m); down.set(m, cur2[1] + 1); q2.push([m, cur2[1] + 1]); }
        });
      }
    }
    events.forEach(function (ev) {
      var hop = ev._hop;
      if (!hop) return;
      if (selId == null || !byId.has(selId)) { hop.hidden = true; return; }
      if (ev.id === selId) {
        hop.hidden = false; hop.classList.add("root"); hop.textContent = "root";
        hop.title = "Selected event - root of this causal chain";
        hop.setAttribute("aria-label", hop.title);
        return;
      }
      var parts = [], hints = [];
      if (up.has(ev.id)) { parts.push("-" + up.get(ev.id)); hints.push(up.get(ev.id) + " step" + (up.get(ev.id) === 1 ? "" : "s") + " upstream"); }
      if (down.has(ev.id)) { parts.push("+" + down.get(ev.id)); hints.push(down.get(ev.id) + " step" + (down.get(ev.id) === 1 ? "" : "s") + " downstream"); }
      if (parts.length) {
        hop.hidden = false; hop.classList.remove("root"); hop.textContent = parts.join(" ");
        hop.title = hints.join(" and ") + " of the selected event";
        hop.setAttribute("aria-label", hop.title);
      }
      else { hop.hidden = true; }
    });
  }

  /* dossier relation lines (visible in dossier / print views) */
  events.forEach(function (ev) {
    var ins = (relIn.get(ev.id) || []).filter(valid), outs = (relOut.get(ev.id) || []).filter(valid);
    if (!ins.length && !outs.length) return;
    var rel = el("div", "ev-rel");
    if (ins.length) {
      var r1 = el("div", "ev-rel-line");
      r1.textContent = "From: " + ins.map(function (ln) { var a = byId.get(ln.from); return ((a && a.title) || ln.from) + " (" + (ln.label || "led to") + ")"; }).join(" · ");
      rel.append(r1);
    }
    if (outs.length) {
      var r2 = el("div", "ev-rel-line");
      r2.textContent = "To: " + outs.map(function (ln) { var b = byId.get(ln.to); return ((b && b.title) || ln.to) + " (" + (ln.label || "led to") + ")"; }).join(" · ");
      rel.append(r2);
    }
    ev._card.append(rel);
  });

  /* copy citation */
  function citationText(s) {
    var parts = [s.label || s.url || "Source"];
    if (s.excerpt) parts.push('"' + s.excerpt + '"');
    if (s.locator) parts.push("(" + s.locator + ")");
    if (s.url) parts.push(s.url);
    if (s.archive_url) parts.push("[archived: " + s.archive_url + "]");
    return parts.join(" ");
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
    if (done) done();
  }
  function copyCitation(s, btn) {
    var acc = (D.meta && typeof D.meta === "object" && D.meta.last_verified) ? D.meta.last_verified : new Date().toISOString().slice(0, 10);
    var text = citationText(s) + " (accessed " + acc + ")";
    var done = function () {
      btn.textContent = "copied";
      setTimeout(function () { btn.textContent = "copy citation"; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  var hiId = null, selId = null, stepIdx = { out: 0, in: 0 };
  var fEntity = null, fTag = null, fText = "";

  function filterActive() { return fEntity !== null || fTag !== null || fText !== ""; }

  function matches(ev) {
    if (fEntity !== null && (!Array.isArray(ev.actors) || ev.actors.map(String).indexOf(fEntity) < 0)) return false;
    if (fTag !== null && (!Array.isArray(ev.tags) || ev.tags.indexOf(fTag) < 0)) return false;
    if (fText) {
      var hay = (ev.title || "") + " " + (ev.description || "") + " " + (ev.date_label || "");
      if (Array.isArray(ev.actors)) hay += " " + ev.actors.map(entName).join(" ");
      if (Array.isArray(ev.sources)) ev.sources.forEach(function (s) {
        hay += " " + (s && typeof s === "object" ? (s.label || "") + " " + (s.excerpt || "") : String(s || ""));
      });
      if (hay.toLowerCase().indexOf(fText) < 0) return false;
    }
    return true;
  }

  function doClear() {
    colEls.forEach(function (c) { c.classList.remove("dim", "chain"); });
    events.forEach(function (ev) { if (ev._card) ev._card.classList.remove("focus"); });
    allPaths().forEach(function (p) { p.classList.remove("active", "dimmed"); });
    Array.prototype.forEach.call(svg.querySelectorAll(".dot, .axdate"), function (m) { m.classList.remove("active", "dimmed"); });
  }

  function applyFilter() {
    doClear();
    var count = document.getElementById("fcount");
    if (!filterActive()) { if (count) count.textContent = ""; return; }
    var shown = 0;
    colEls.forEach(function (c) {
      var ev = byId.get(c.dataset.id);
      var on = ev && matches(ev);
      if (on) shown++;
      c.classList.toggle("dim", !on);
    });
    allPaths().forEach(function (p) {
      var a = byId.get(p.dataset.from), b = byId.get(p.dataset.to);
      p.classList.toggle("dimmed", !(a && b && matches(a) && matches(b)));
    });
    Array.prototype.forEach.call(svg.querySelectorAll(".dot, .axdate"), function (m) {
      var ev = byId.get(m.dataset.id);
      m.classList.toggle("dimmed", !(ev && matches(ev)));
    });
    if (count) count.textContent = shown + " of " + events.length + " shown";
  }

  function highlight(id) {
    var near = neighborsOf(id);
    colEls.forEach(function (c) {
      var on = near.has(c.dataset.id);
      c.classList.toggle("chain", on && c.dataset.id !== id);
      c.classList.toggle("dim", !on);
    });
    var me = byId.get(id);
    if (me && me._card) me._card.classList.add("focus");
    allPaths().forEach(function (p) {
      var direct = p.dataset.from === id || p.dataset.to === id;
      p.classList.toggle("active", direct);
      p.classList.toggle("dimmed", !direct);
    });
    Array.prototype.forEach.call(svg.querySelectorAll(".dot, .axdate"), function (m) {
      var on = near.has(m.dataset.id);
      m.classList.toggle("dimmed", !on);
      m.classList.toggle("active", m.dataset.id === id);
    });
  }

  function setHi(id) { hiId = id; highlight(id); }
  function unHi() { hiId = null; if (filterActive()) applyFilter(); else doClear(); }

  function toggleExpand(ev) {
    if (zoom < 0.85 && !document.body.classList.contains("dossier")) {
      applyZoom(1, ev.id);
      return;
    }
    var open = ev._card.classList.toggle("expanded");
    ev._col.classList.toggle("expanded", open);
    fitStageToExpanded();
    try { history.replaceState(null, "", open ? "#" + encodeURIComponent(ev.id) : "#"); } catch (e) {}
  }

  events.forEach(function (ev) {
    var card = ev._card;
    card.addEventListener("mouseenter", function () { setHi(ev.id); });
    card.addEventListener("mouseleave", unHi);
    card.addEventListener("focus", function () { setHi(ev.id); selId = ev.id; updateHops(); });
    card.addEventListener("blur", function () { selId = null; updateHops(); unHi(); });
    card.addEventListener("click", function (e) {
      if (e.target && e.target.closest && e.target.closest("a, button")) return;
      toggleExpand(ev);
    });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleExpand(ev);
      }
    });
  });

  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.closest && t.closest("input, textarea, select")) return;
    if (e.key === "Escape") {
      var any = false;
      events.forEach(function (ev) {
        if (ev._card.classList.contains("expanded")) {
          ev._card.classList.remove("expanded");
          ev._col.classList.remove("expanded");
          any = true;
        }
      });
      fitStageToExpanded();
      if (filterActive()) {
        fEntity = null; fTag = null; fText = "";
        var q = document.getElementById("q");
        if (q) q.value = "";
        syncPills();
        applyFilter();
      } else {
        unHi();
      }
    }
    if (e.key === "/") {
      var q2 = document.getElementById("q");
      if (q2) { e.preventDefault(); q2.focus(); }
    }
    if ((e.key === "]" || e.key === "[") && selId != null) {
      var forward = e.key === "]";
      var cands = ((forward ? outMap : inMap).get(selId) || []).filter(function (cid) { return byId.has(cid); });
      if (cands.length) {
        e.preventDefault();
        var sk = forward ? "out" : "in";
        var idx = stepIdx[sk] % cands.length;
        stepIdx[sk] = idx + 1;
        var target = byId.get(cands[idx]);
        if (target && target._card) {
          stage.scrollTo({ left: Math.max(0, target._cx - stage.clientWidth / 2), behavior: reduceMotion ? "auto" : "smooth" });
          try { target._card.focus({ preventScroll: true }); } catch (err) { target._card.focus(); }
        }
      }
    }
  });

  /* ---------- layout: time scale, lanes, LOD ---------- */
  var PAD_X = 80, PAD_TOP = 48, PAD_BOTTOM = 34;
  var AXIS_CLEAR = 32, TIER_GAP = 20, GUTTER = 16;
  var COL_TARGET = 340, CARD_W = 300;
  var metrics = { W: 0, H: 0, axisY: 0 };
  var segments = [];
  var scaleMode = "hybrid";
  var zoom = 1;
  var anchorId = null;

  try {
    var savedScale = localStorage.getItem("cs-scale");
    if (savedScale === "proportional" || savedScale === "hybrid" || savedScale === "ordinal") scaleMode = savedScale;
  } catch (e) {}

  function narrow() { return !!(window.matchMedia && window.matchMedia("(max-width: 760px)").matches); }
  function lodFor() { return zoom < 0.45 ? "lod-overview" : zoom < 0.85 ? "lod-compact" : "lod-full"; }
  function cardWidthFor() {
    if (zoom < 0.45) return 132;
    if (zoom < 0.85) return 210;
    return narrow() ? 252 : 300;
  }
  function gapWidthPx() { return Math.max(52, Math.round(92 * Math.min(1, Math.sqrt(zoom)))); }

  function medianOf(arr) {
    if (!arr.length) return 0;
    var s = arr.slice().sort(function (a, b) { return a - b; });
    return s[Math.floor(s.length / 2)];
  }

  function buildScale() {
    var n = events.length;
    var half = CARD_W / 2;
    segments = [];

    if (scaleMode === "ordinal") {
      var colW = (CARD_W + 40) * (zoom > 1 ? Math.min(zoom, 2.5) : 1);
      events.forEach(function (ev, i) { ev._cx = PAD_X + colW * (i + 0.5); });
      return { W: n * colW + 2 * PAD_X };
    }

    var times = events.map(function (ev) { return dayVal(ev.start); });
    var deltas = [];
    for (var i = 1; i < n; i++) {
      if (times[i] != null && times[i - 1] != null) {
        var dd = times[i] - times[i - 1];
        if (dd > 0) deltas.push(dd);
      }
    }
    if (!deltas.length) {
      var colW2 = (CARD_W + 40) * (zoom > 1 ? Math.min(zoom, 2.5) : 1);
      events.forEach(function (ev, j) { ev._cx = PAD_X + colW2 * (j + 0.5); });
      return { W: n * colW2 + 2 * PAD_X };
    }

    var median = medianOf(deltas);
    var tGap = Math.max(2 * median, 120);
    var segs = [];
    var cur = null;

    events.forEach(function (ev, i) {
      var t = times[i];
      if (t == null) {
        if (cur) { segs.push(cur); cur = null; }
        segs.push({ type: "null", events: [i] });
        return;
      }
      if (!cur) {
        cur = { type: "cluster", t0: t, t1: t, times: [t], events: [i] };
        return;
      }
      var gapDays = t - cur.t1;
      if (scaleMode !== "proportional" && (gapDays > tGap || (gapDays > 0 && ev.gap_before))) {
        segs.push(cur);
        segs.push({ type: "gap", t0: cur.t1, t1: t, gapDays: gapDays, manual: ev.gap_before || null });
        cur = { type: "cluster", t0: t, t1: t, times: [t], events: [i] };
      } else {
        cur.t1 = t;
        cur.times.push(t);
        cur.events.push(i);
      }
    });
    if (cur) segs.push(cur);

    var clusterDays = 0;
    segs.forEach(function (s) {
      if (s.type === "cluster") clusterDays += Math.max(0, s.t1 - s.t0);
    });
    var K = median > 0 ? COL_TARGET / median : 1;
    if (clusterDays > 0) K = Math.min(K, (n * COL_TARGET) / clusterDays);
    if (!isFinite(K) || K <= 0) K = 1;
    K *= zoom;

    var cursorX = PAD_X, maxRight = PAD_X;
    segs.forEach(function (seg, si) {
      if (seg.type === "gap") {
        seg.x0 = cursorX;
        seg.x1 = cursorX + gapWidthPx();
        cursorX = seg.x1;
        return;
      }
      if (si > 0 && segs[si - 1].type !== "gap") cursorX += 40;
      if (seg.type === "null") {
        var cx0 = cursorX + half;
        seg.events.forEach(function (i) { events[i]._cx = cx0; });
        maxRight = Math.max(maxRight, cx0 + half);
        cursorX = cx0 + half;
        return;
      }
      var first = cursorX + half;
      var prevX = null;
      var minStride = half + 8;
      seg.events.forEach(function (i) {
        var x = first + (times[i] - seg.t0) * K;
        if (prevX != null && x < prevX + minStride) x = prevX + minStride;
        events[i]._cx = x;
        prevX = x;
        maxRight = Math.max(maxRight, x + half);
      });
      seg.x0 = first;
      seg.x1 = prevX;
      seg.pxPerDay = seg.t1 > seg.t0 ? (seg.x1 - seg.x0) / (seg.t1 - seg.t0) : K;
      cursorX = prevX + half;
    });

    segments = segs;
    return { W: maxRight + PAD_X };
  }

  function packLanes() {
    var half = CARD_W / 2;
    var up = [], down = [];
    events.slice().sort(function (a, b) { return a._cx - b._cx; }).forEach(function (ev) {
      var lanes = ev._above ? up : down;
      var left = ev._cx - half;
      var right = ev._cx + half + GUTTER;
      var k = 0;
      while (k < lanes.length && !(lanes[k].right <= left + 0.5)) k++;
      if (!lanes[k]) lanes[k] = { right: -Infinity, h: 0 };
      lanes[k].right = right;
      lanes[k].h = Math.max(lanes[k].h, ev._h);
      ev._lane = lanes[k];
    });
    return { up: up, down: down };
  }

  function stackHeight(lanes) {
    var h = 0;
    lanes.forEach(function (l, i) { h += l.h + (i ? TIER_GAP : 0); });
    return h;
  }

  function centerEventId() {
    var mid = stage.scrollLeft + stage.clientWidth / 2;
    var best = null, bd = Infinity;
    events.forEach(function (ev) {
      if (ev._cx == null) return;
      var d = Math.abs(ev._cx - mid);
      if (d < bd) { bd = d; best = ev.id; }
    });
    return best;
  }

  function layout() {
    if (!events.length) {
      canvas.style.width = "100%";
      canvas.style.height = "120px";
      sizer.style.width = "100%";
      sizer.style.height = "120px";
      segments = [];
      metrics = { W: 0, H: 0, axisY: 0 };
      if (!canvas.querySelector(".empty")) {
        var msg = el("p", "axdate empty");
        msg.textContent = "No events in this timeline.";
        canvas.append(msg);
      }
      buildMinimap();
      updateMinimap();
      return;
    }

    var keep = anchorId || (metrics.W && stage.scrollLeft > 2 ? centerEventId() : null);
    CARD_W = cardWidthFor();
    var lod = lodFor();
    canvas.classList.remove("lod-overview", "lod-compact", "lod-full");
    canvas.classList.add(lod);

    events.forEach(function (ev) {
      ev._col.style.width = CARD_W + "px";
      ev._col.style.left = "0px";
      ev._col.style.top = "0px";
      /* Expanded cards are overlays: bank math must always use the card's
         resting height, so measure with the expansion briefly removed. */
      var card = ev._card;
      var wasOpen = card.classList.contains("expanded");
      var scrollTop = card.scrollTop;
      if (wasOpen) card.classList.remove("expanded");
      ev._h = ev._col.offsetHeight;
      if (wasOpen) { card.classList.add("expanded"); card.scrollTop = scrollTop; }
      ev._lane = null;
    });

    var built = buildScale();
    var packed = packLanes();
    var upH = stackHeight(packed.up), downH = stackHeight(packed.down);
    var axisY = PAD_TOP + upH + AXIS_CLEAR;
    var H = axisY + AXIS_CLEAR + downH + PAD_BOTTOM;

    var bottom = axisY - AXIS_CLEAR;
    packed.up.forEach(function (lane) {
      lane.top = bottom - lane.h;
      bottom = lane.top - TIER_GAP;
    });
    var top2 = axisY + AXIS_CLEAR;
    packed.down.forEach(function (lane) {
      lane.top = top2;
      top2 += lane.h + TIER_GAP;
    });

    events.forEach(function (ev) {
      ev._top = ev._lane ? ev._lane.top : 0;
      ev._col.style.left = (ev._cx - CARD_W / 2) + "px";
      ev._col.style.top = ev._top + "px";
    });

    metrics = { W: built.W, H: H, axisY: axisY };
    canvas.style.width = built.W + "px";
    canvas.style.height = H + "px";
    sizer.style.width = built.W + "px";
    sizer.style.height = H + "px";
    draw();
    buildMinimap();
    updateMinimap();

    if (keep) {
      var kev = byId.get(keep);
      if (kev) stage.scrollLeft = Math.max(0, kev._cx - stage.clientWidth / 2);
    }
    fitStageToExpanded();
    anchorId = null;
  }

  /* Expanded cards are overlays, so they must not be clipped by the stage's
     viewport. Grow the sizer (and therefore the stage) only when an open card
     needs room below the normal canvas. */
  function fitStageToExpanded() {
    if (!metrics.H || document.body.classList.contains("dossier")) return;
    var needed = metrics.H;
    events.forEach(function (ev) {
      if (ev._card && ev._card.classList.contains("expanded")) {
        needed = Math.max(needed, ev._col.offsetTop + ev._col.offsetHeight + 24);
      }
    });
    sizer.style.height = needed + "px";
  }

  var ltimer = 0;
  function scheduleLayout() { clearTimeout(ltimer); ltimer = setTimeout(layout, 16); }

  /* ---------- time <-> pixels ---------- */
  function xForTime(t) {
    if (!segments.length || t == null) return null;
    var last = null;
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      if (s.type === "null") continue;
      if (t < s.t0) return s.x0;
      if (t <= s.t1) {
        var span = s.x1 - s.x0, days = s.t1 - s.t0;
        return days > 0 ? s.x0 + (t - s.t0) * span / days : s.x0;
      }
      last = s;
    }
    return last ? last.x1 : null;
  }
  function timeAtX(x) {
    if (!segments.length) return null;
    var last = null;
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      if (s.type === "null") continue;
      if (x <= s.x1 || i === segments.length - 1) {
        var span = s.x1 - s.x0;
        var r = span > 0 ? (x - s.x0) / span : 0;
        return s.t0 + r * (s.t1 - s.t0);
      }
      last = s;
    }
    return last ? last.t1 : null;
  }
  function crossesGap(x1, x2) {
    var a = Math.min(x1, x2), b = Math.max(x1, x2);
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      if (s.type === "gap" && s.x1 > a && s.x0 < b) return true;
    }
    return false;
  }

  /* ---------- draw svg ---------- */
  var TICK_LADDER = [
    { u: "h", v: 1 / 24, kind: "ms", step: 3600000 },
    { u: "h", v: 3 / 24, kind: "ms", step: 10800000 },
    { u: "h", v: 6 / 24, kind: "ms", step: 21600000 },
    { u: "h", v: 12 / 24, kind: "ms", step: 43200000 },
    { u: "d", v: 1, kind: "ms", step: 86400000 },
    { u: "d", v: 2, kind: "ms", step: 172800000 },
    { u: "w", v: 7, kind: "ms", step: 604800000 },
    { u: "mo", v: 30.4375, kind: "mo", step: 1 },
    { u: "mo", v: 91.3125, kind: "mo", step: 3 },
    { u: "y", v: 365.25, kind: "y", step: 1 },
    { u: "y", v: 730.5, kind: "y", step: 2 },
    { u: "y", v: 1826.25, kind: "y", step: 5 },
    { u: "y", v: 3652.5, kind: "y", step: 10 },
    { u: "y", v: 7305, kind: "y", step: 20 },
    { u: "y", v: 18262.5, kind: "y", step: 50 },
    { u: "y", v: 36525, kind: "y", step: 100 },
    { u: "y", v: 182625, kind: "y", step: 500 }
  ];

  function ticksFor(seg) {
    var spanPx = seg.x1 - seg.x0, spanDays = seg.t1 - seg.t0;
    if (spanPx <= 4 || spanDays <= 0) return { ticks: [], unit: "" };
    var chosen = null;
    for (var i = 0; i < TICK_LADDER.length; i++) {
      var cand = TICK_LADDER[i];
      if (spanPx * cand.v / spanDays >= 88) { chosen = cand; break; }
    }
    if (!chosen) chosen = TICK_LADDER[TICK_LADDER.length - 1];
    var startMs = seg.t0 * DAY, endMs = seg.t1 * DAY;
    var out = [];
    if (chosen.kind === "ms") {
      var ms = Math.ceil(startMs / chosen.step) * chosen.step;
      for (; ms <= endMs; ms += chosen.step) out.push(ms);
    } else if (chosen.kind === "mo") {
      var d0 = new Date(startMs);
      var mi = d0.getUTCFullYear() * 12 + d0.getUTCMonth();
      mi = Math.ceil(mi / chosen.step) * chosen.step;
      for (;;) {
        var yy = Math.floor(mi / 12), mm = mi % 12;
        if (mm < 0) { mm += 12; yy -= 1; }
        var dt = new Date(0);
        dt.setUTCHours(0, 0, 0, 0);
        dt.setUTCFullYear(yy, mm, 1);
        var mms = dt.getTime();
        if (mms > endMs) break;
        if (mms >= startMs) out.push(mms);
        mi += chosen.step;
      }
    } else {
      var y = Math.ceil(new Date(startMs).getUTCFullYear() / chosen.step) * chosen.step;
      for (;;) {
        var dt2 = new Date(0);
        dt2.setUTCHours(0, 0, 0, 0);
        dt2.setUTCFullYear(y, 0, 1);
        var yms = dt2.getTime();
        if (yms > endMs) break;
        if (yms >= startMs) out.push(yms);
        y += chosen.step;
      }

    return { ticks: out, unit: chosen.u };
  }

  function draw() {
    var W = metrics.W, H = metrics.H, axisY = metrics.axisY;
    if (!W || !H) return;

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.style.width = W + "px";
    svg.style.height = H + "px";

    var defs = document.createElementNS(NS, "defs");
    var marker = document.createElementNS(NS, "marker");
    marker.setAttribute("id", "arrowhead");
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "8");
    marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "7");
    marker.setAttribute("markerHeight", "7");
    marker.setAttribute("orient", "auto");
    var mp = document.createElementNS(NS, "path");
    mp.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");

    hatch.setAttribute("id", "hatch");
    hatch.setAttribute("patternUnits", "userSpaceOnUse");
    hatch.setAttribute("patternTransform", "rotate(45)");
    hatch.setAttribute("width", "7");
    hatch.setAttribute("height", "7");

    }

      eras.forEach(function (er, idx) {
        var x1 = xForTime(dayVal(er.start));
        var x2 = xForTime(dayVal(er.end));
        if (x1 == null || x2 == null || x2 - x1 < 2) return;
        var rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", x1);
        rect.setAttribute("y", 0);
        rect.setAttribute("width", x2 - x1);

        rect.setAttribute("class", "era" + (idx % 2 ? " alt" : ""));

        svg.append(line(x1, 0, x1, H, "era-edge"));

    var gapLabels = [];
    var tickLabels = [];
    var placedLabels = [];

    function labelBox(x, y, text, anchor) {

    }
    function reserveLabel(x, y, text, anchor) {

    function ribbon(x1, x2, label, shortLabel, tip) {

      var rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", x1);
      rect.setAttribute("y", axisY - 8);
      rect.setAttribute("width", w);
      rect.setAttribute("height", 16);
      rect.setAttribute("rx", "3");
      rect.setAttribute("fill", "url(#hatch)");
      rect.setAttribute("class", "gapband");

        rect.setAttribute("aria-label", String(tip));

      svg.append(rect);
      if (zoom >= 0.45 && w >= 38) {
        var cx = (x1 + x2) / 2;
        var gy = axisY + 3.5;
        var text = label;
        var box = labelBox(cx, gy, text, "middle");
        if (box.x2 - box.x1 > w - 2) {
          text = shortLabel || "";
          box = labelBox(cx, gy, text, "middle");
        }
        if (text && box.x2 - box.x1 <= w - 2 && !labelCollides(box)) {

          gapLabels.push({ x: cx, y: gy, text: text });

    }

    // compressed silences
    if (scaleMode === "hybrid") {
      segments.forEach(function (seg) {
        if (seg.type !== "gap") return;
        var manual = (seg.manual && seg.manual.label) ? String(seg.manual.label) : "";
        var shortLabel = "// " + fmtGapShort(seg.gapDays) + " //";
        var label = manual ? "// " + manual + " //" : shortLabel;
        var tip = "No recorded events for " + fmtGap(seg.gapDays / 365.25) + (manual ? " - " + manual : "");
        ribbon(seg.x0 + 2, seg.x1 - 2, label, shortLabel, tip);
      });
    }

    // leader stems from each card to the spine
    events.forEach(function (ev) {
      var edgeY = ev._above ? ev._top + ev._h : ev._top;
      svg.append(line(ev._cx, axisY, ev._cx, edgeY, "stem"));
    });

    // axis labels: event dates where there is room, a time ladder where there is not
    if (scaleMode !== "ordinal") {
      segments.forEach(function (seg) {
        if (seg.type !== "cluster") return;
        var nEv = seg.events.length;
        var avg = nEv > 1 ? (seg.x1 - seg.x0) / (nEv - 1) : Infinity;
        var useTicks = nEv > 1 && (zoom < 0.45 || avg < 88);
        if (!useTicks) {
          seg.events.forEach(function (i) {
            var ev = events[i];
            var dy = ev._above ? axisY + 20 : axisY - 9;
            var dtxt = axisDate(ev);
            if (!dtxt) return;
            var box = labelBox(ev._cx + 9, dy, dtxt, "start");
            if (box.x2 > W - 2 || labelCollides(box)) return;
            reserveLabel(ev._cx + 9, dy, dtxt, "start");
            var t0 = svgText(ev._cx + 9, dy, "axdate", dtxt);
            t0.dataset.id = ev.id;

        }
        var got = ticksFor(seg);
        got.ticks.forEach(function (ms) {

          if (x < seg.x0 - 0.5 || x > seg.x1 + 0.5) return;
          svg.append(line(x, axisY, x, axisY + 6, "ttick"));
          var tt = tickText(ms, got.unit);
          var box = labelBox(x, axisY + 19, tt, "middle");
          if (box.x1 < 0 || box.x2 > W || labelCollides(box)) return;
          reserveLabel(x, axisY + 19, tt, "middle");
          tickLabels.push({ x: x, y: axisY + 19, text: tt });
        });
      });
    } else {
      events.forEach(function (ev) {
        var dy0 = ev._above ? axisY + 20 : axisY - 9;
        var dt0 = axisDate(ev);
        if (!dt0) return;
        var box = labelBox(ev._cx + 9, dy0, dt0, "start");
        if (box.x2 > W - 2 || labelCollides(box)) return;
        reserveLabel(ev._cx + 9, dy0, dt0, "start");
        var t = svgText(ev._cx + 9, dy0, "axdate", dt0);
        t.dataset.id = ev.id;
        svg.append(t);
      });
    }

    // causal links — lane-routed, perpendicular into card edges
    links.forEach(function (ln, k) {
      if (!valid(ln)) return;
      var a = byId.get(ln.from), b = byId.get(ln.to);
      var p1x = a._cx, p1y = a._above ? a._top + a._h : a._top;
      var p2x = b._cx, p2y = b._above ? b._top + b._h : b._top;
      var side = a._above ? -1 : 1;
      var laneY = axisY + side * (14 + (k % 3) * 6);
      var gap = crossesGap(p1x, p2x);

      var d = "M " + p1x + " " + p1y +
              " C " + p1x + " " + laneY +
              ", " + p2x + " " + laneY +
              ", " + p2x + " " + p2y;

      var path = document.createElementNS(NS, "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "lk" + (infer(ln) ? " infer" : "") + (gap ? " gapcross" : ""));
      path.setAttribute("marker-end", "url(#arrowhead)");
      path.dataset.from = ln.from;
      path.dataset.to = ln.to;
      path.dataset.lid = k;
      svg.append(path);

      var len = path.getTotalLength();
      var labelText = ln.label || "led to";
      var fracs = gap ? [0.38, 0.62, 0.24, 0.76, 0.5] : [0.5, 0.34, 0.66, 0.22, 0.78];
      var chosen = null;
      for (var fi = 0; fi < fracs.length && !chosen; fi++) {
        var pt = path.getPointAtLength(len * fracs[fi]);
        var lanes = pt.y > axisY ? [axisY + 27, axisY - 22] : [axisY - 22, axisY + 27];
        for (var li = 0; li < lanes.length; li++) {
          var box = labelBox(pt.x, lanes[li], labelText, "middle");
          if (box.x1 < 6 || box.x2 > W - 6) continue;
          if (!labelCollides(box)) {
            chosen = { x: pt.x, y: lanes[li], box: box };
            break;
          }
        }
      }
      var labelClass = "lklabel";
      if (!chosen) {
        var mid = path.getPointAtLength(len * 0.5);
        chosen = {
          x: Math.min(W - 24, Math.max(24, mid.x)),
          y: mid.y > axisY ? axisY + 27 : axisY - 22

      } else {
        placedLabels.push(chosen.box);
      }
      var t = svgText(chosen.x, chosen.y, labelClass, labelText);
      t.dataset.from = ln.from;
      t.dataset.to = ln.to;
      t.dataset.lid = k;
      svg.append(t);
    });

    // event dots on the spine
    events.forEach(function (ev) {
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", ev._cx);
      dot.setAttribute("cy", axisY);
      dot.setAttribute("r", "3.5");
      dot.setAttribute("class", "dot");
      dot.dataset.id = ev.id;
      svg.append(dot);
    });

    // labels above links
    tickLabels.forEach(function (tl) {
      var el2 = svgText(tl.x, tl.y, "ttick-label", tl.text);
      el2.setAttribute("text-anchor", "middle");
      svg.append(el2);
    });
    gapLabels.forEach(function (gl) {
      var t = svgText(gl.x, gl.y, "gaplabel", gl.text);
      t.setAttribute("text-anchor", "middle");
      svg.append(t);
    });
  }

  /* ---------- zoom (real relayout, not a CSS transform) ---------- */
  var zoomLabel = document.getElementById("zoom-reset");
  function applyZoom(z, keepId) {
    z = Math.min(5, Math.max(0.25, Math.round(z * 100) / 100));
    zoomLabel.textContent = Math.round(z * 100) + "%";

    anchorId = keepId || centerEventId();
    zoom = z;
    scheduleLayout();
  }

    var rect = stage.getBoundingClientRect();
    var x = stage.scrollLeft + (clientX - rect.left);
    var best = null, bd = Infinity;
    events.forEach(function (ev) {
      var d = Math.abs(ev._cx - x);
      if (d < bd) { bd = d; best = ev.id; }
    });
    return best;
  }
  document.getElementById("zoom-in").addEventListener("click", function () { applyZoom(zoom * 1.25); });
  document.getElementById("zoom-out").addEventListener("click", function () { applyZoom(zoom / 1.25); });
  zoomLabel.addEventListener("click", function () { applyZoom(1); });

  /* ---------- pan: drag, wheel, buttons, keys ---------- */
  var dragSL = 0, dragX = 0, dragging = false, dragMoved = false;

  function onDragMove(e) {
    if (!dragging) return;
    var dx = e.clientX - dragX;
    if (!dragMoved && Math.abs(dx) > 5) { dragMoved = true; stage.classList.add("dragging"); }
    if (dragMoved) stage.scrollLeft = dragSL - dx;

    window.removeEventListener("pointercancel", endDrag);

    if (e.pointerType !== "mouse" || e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest("a, button, input, select, textarea")) return;
    dragging = true;
    dragMoved = false;
    dragX = e.clientX;
    dragSL = stage.scrollLeft;
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

  stage.addEventListener("click", function (e) {

  stage.addEventListener("wheel", function (e) {
    if (e.ctrlKey || e.metaKey) {

    var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;

  /* two-finger pinch: 4px deadzone, anchored at the midpoint */
  var touchPts = new Map(), pinchStart = 0, pinchBase = 1, pinchAnchor = null, pinchActive = false;

      pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;

  stage.addEventListener("pointermove", function (e) {
    if (!touchPts.has(e.pointerId)) return;
    touchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touchPts.size !== 2) return;
    var pts = Array.from(touchPts.values());

  stage.addEventListener("pointercancel", endTouch);

  document.getElementById("pan-left").addEventListener("click", function () {
    stage.scrollBy({ left: -stage.clientWidth * 0.8, behavior: reduceMotion ? "auto" : "smooth" });
  });
  document.getElementById("pan-right").addEventListener("click", function () {
    stage.scrollBy({ left: stage.clientWidth * 0.8, behavior: reduceMotion ? "auto" : "smooth" });
  });
  stage.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { stage.scrollLeft += 120; e.preventDefault(); }
    if (e.key === "ArrowLeft") { stage.scrollLeft -= 120; e.preventDefault(); }
    if (e.key === "+" || e.key === "=") { applyZoom(zoom * 1.25); e.preventDefault(); }
    if (e.key === "-" || e.key === "_") { applyZoom(zoom / 1.25); e.preventDefault(); }
    if (e.key === "0") { applyZoom(1); e.preventDefault(); }
  });

  /* ---------- theme ---------- */
  document.getElementById("theme").addEventListener("click", function () {
    var t = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = t;
    try { localStorage.setItem("cs-theme", t); } catch (e) {}
  });

  /* ---------- filters: search, cast pills, tag pills ---------- */
  var filtersEl = document.getElementById("filters");
  var qInput = document.getElementById("q");
  var pillsEl = document.getElementById("pills");
  var clearBtn = document.getElementById("fclear");

  var tagList = [];
  events.forEach(function (ev) {
    if (Array.isArray(ev.tags)) ev.tags.forEach(function (t) {
      if (t != null && tagList.indexOf(String(t)) < 0) tagList.push(String(t));
    });
  });

  function syncPills() {
    Array.prototype.forEach.call(pillsEl.querySelectorAll(".pill"), function (b) {
      var on = b.dataset.kind === "entity" ? b.dataset.id === fEntity : b.dataset.id === fTag;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
