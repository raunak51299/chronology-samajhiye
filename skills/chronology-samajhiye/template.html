  }

  function makePill(kind, id, text, title) {
    var b = el("button", "pill");
    b.type = "button";
    b.dataset.kind = kind;
    b.dataset.id = id;
    b.textContent = text;
    b.title = title;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () {
      if (kind === "entity") fEntity = (fEntity === id) ? null : id;
      else fTag = (fTag === id) ? null : id;
      syncPills();
      applyFilter();
    });
    return b;
  }

  if (events.length) filtersEl.hidden = false;

  entities.forEach(function (en) {
    if (!en || en.id == null) return;
    var n = events.filter(function (ev) { return Array.isArray(ev.actors) && ev.actors.map(String).indexOf(String(en.id)) >= 0; }).length;
    if (!n) return;
    pillsEl.append(makePill("entity", String(en.id), en.name || String(en.id), (en.role ? en.role + " — " : "") + n + " event" + (n === 1 ? "" : "s")));
  });
  tagList.forEach(function (t) {
    var n = events.filter(function (ev) { return Array.isArray(ev.tags) && ev.tags.indexOf(t) >= 0; }).length;
    pillsEl.append(makePill("tag", t, "#" + t, n + " event" + (n === 1 ? "" : "s")));
  });

  var matchList = [], matchIdx = 0;
  function goNextMatch() {
    matchList = events.filter(matches);
    if (!matchList.length) return;
    var ev = matchList[matchIdx % matchList.length];
    matchIdx++;
    stage.scrollTo({ left: Math.max(0, ev._cx - stage.clientWidth / 2), behavior: reduceMotion ? "auto" : "smooth" });
  }

  if (qInput) {
    qInput.addEventListener("input", function () {
      fText = qInput.value.trim().toLowerCase();
      matchIdx = 0;
      clearBtn.hidden = !filterActive();
      applyFilter();
    });
    qInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); goNextMatch(); }
      if (e.key === "Escape") {
        fEntity = null; fTag = null; fText = ""; qInput.value = "";
        syncPills();
        applyFilter();
      }
    });
  }
  clearBtn.addEventListener("click", function () {
    fEntity = null; fTag = null; fText = "";
    if (qInput) qInput.value = "";
    syncPills();
    applyFilter();
  });

  /* ---------- methodology & audit drawer ---------- */
  var metaInfo = D.meta && typeof D.meta === "object" ? D.meta : {};
  var solid = links.filter(function (l) { return valid(l) && !infer(l); }).length;
  var dashed = links.filter(function (l) { return valid(l) && infer(l); }).length;
  (function () {
    var body = document.getElementById("methBody");
    if (!body) return;
    var sourced = events.filter(function (ev) { return Array.isArray(ev.sources) && ev.sources.length; }).length;
    var pct = Math.round((sourced / Math.max(1, events.length)) * 100);
    var flagged = events.filter(function (ev) { var s = String(ev.status || "").toLowerCase(); return s === "alleged" || s === "disputed"; }).length;
    var countered = events.filter(function (ev) { return Array.isArray(ev.counter_sources) && ev.counter_sources.length; }).length;
    var auditLine = events.length + " events · " + sourced + " sourced (" + pct + "%) · " + solid + " stated / " + dashed + " inferred links";
    if (flagged) auditLine += " · " + flagged + " alleged/disputed";
    if (countered) auditLine += " · " + countered + " with counter-sources";
    var audit = el("p", "meth-audit");
    audit.textContent = auditLine;
    body.append(audit);
    if (metaInfo.methodology) {
      var m1 = el("p", "meth-note");
      m1.textContent = metaInfo.methodology;
      body.append(m1);
    }
    if (metaInfo.extraction_notes) {
      var m2 = el("p", "meth-note");
      m2.textContent = metaInfo.extraction_notes;
      body.append(m2);
    }
    if (Array.isArray(metaInfo.alternative_hypotheses) && metaInfo.alternative_hypotheses.length) {
      var mh = el("p", "meth-h");
      mh.textContent = "Alternative interpretations considered";
      body.append(mh);
      var ul = el("ul");
      metaInfo.alternative_hypotheses.forEach(function (h) {
        var li = el("li");
        li.textContent = String(h);
        ul.append(li);
      });
      body.append(ul);
    }
    if (metaInfo.last_verified) {
      var m3 = el("p", "meth-note");
      m3.textContent = "Sources last verified: " + metaInfo.last_verified;
      body.append(m3);
    }
  })();

  /* ---------- legend ---------- */
  document.getElementById("legend").textContent =
    events.length + " events · " + (solid + dashed) + " links — solid: stated cause · dashed: inferred · hatched: compressed silence (hybrid) · scale: time / hybrid / ordinal · drag or minimap to travel · / filters · hover lights direct links · [ ] steps the chain";

  /* ---------- relations ledger ---------- */
  (function () {
    var lbody = document.getElementById("ledgerBody");
    if (!lbody) return;
    var rows = [];
    links.forEach(function (ln, li) {
      if (!valid(ln)) return;
      rows.push({ li: li, ln: ln, a: byId.get(ln.from), b: byId.get(ln.to) });
    });
    if (!rows.length) {
      var dl = document.getElementById("ledger");
      if (dl) dl.remove();
      return;
    }
    var tbl = el("table", "ledger-table");
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    ["#", "Cause (from)", "Relation", "Effect (to)", "Confidence"].forEach(function (ht) {
      var th = document.createElement("th");
      th.textContent = ht;
      trh.append(th);
    });
    thead.append(trh);
    tbl.append(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      tr.tabIndex = 0;
      var td1 = document.createElement("td"); td1.textContent = String(i + 1);
      var td2 = document.createElement("td"); td2.textContent = r.a.title || r.a.id;
      var td3 = document.createElement("td"); td3.textContent = r.ln.label || "led to";
      var td4 = document.createElement("td"); td4.textContent = r.b.title || r.b.id;
      var td5 = document.createElement("td");
      td5.textContent = (typeof r.ln.confidence === "number" ? r.ln.confidence.toFixed(2) : "—") + (infer(r.ln) ? " · inferred" : "");
      tr.append(td1, td2, td3, td4, td5);
      var go = function () { flashLink(r.li); };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      tbody.append(tr);
    });
    tbl.append(tbody);
    lbody.append(tbl);
  })();

  var flashTimer = null;
  function flashLink(li) {
    var ln = links[li];
    if (!ln) return;
    var a = byId.get(ln.from), b = byId.get(ln.to);
    Array.prototype.forEach.call(svg.querySelectorAll(".lk.active, .lklabel.active"), function (p) { p.classList.remove("active"); });
    var els = svg.querySelectorAll('.lk[data-lid="' + li + '"], .lklabel[data-lid="' + li + '"]');
    Array.prototype.forEach.call(els, function (p) { p.classList.add("active"); });
    if (a && b) stage.scrollTo({ left: Math.max(0, ((a._cx + b._cx) / 2) - stage.clientWidth / 2), behavior: reduceMotion ? "auto" : "smooth" });
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      Array.prototype.forEach.call(els, function (p) { p.classList.remove("active"); });
    }, 2200);
  }

  /* ---------- dossier / print ---------- */
  var dossierBtn = document.getElementById("dossierBtn");
  if (dossierBtn) {
    dossierBtn.addEventListener("click", function () {
      var on = !document.body.classList.contains("dossier");
      document.body.classList.toggle("dossier", on);
      dossierBtn.classList.toggle("active", on);
      if (on) {
        canvas.classList.remove("lod-overview", "lod-compact", "lod-full");
        window.scrollTo({ top: 0 });
        updateMinimap();
      } else {
        scheduleLayout();
      }
    });
  }
  var printBtn = document.getElementById("printBtn");
  if (printBtn) printBtn.addEventListener("click", function () { window.print(); });
  window.addEventListener("beforeprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; });
  });

  /* ---------- scale mode toggle ---------- */
  var scaleBtns = Array.prototype.slice.call(document.querySelectorAll("#scalemode button"));
  function syncScaleButtons() {
    scaleBtns.forEach(function (b) {
      var on = b.dataset.scale === scaleMode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  scaleBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var m = b.dataset.scale;
      if (m === scaleMode) return;
      scaleMode = m;
      try { localStorage.setItem("cs-scale", m); } catch (e) {}
      syncScaleButtons();
      anchorId = centerEventId();
      scheduleLayout();
    });
  });
  syncScaleButtons();

  /* ---------- minimap ---------- */
  var mmEl = document.getElementById("minimap");
  var mmTrack = document.getElementById("mmTrack");
  var mmInner = document.getElementById("mmInner");
  var mmThumb = document.getElementById("mmThumb");
  var mmTimer = 0;

  function minimapValueText() {
    var maxScroll = Math.max(0, stage.scrollWidth - stage.clientWidth);
    if (!maxScroll) return "Full timeline visible";
    var a = timeAtX(stage.scrollLeft);
    var b = timeAtX(stage.scrollLeft + stage.clientWidth);
    if (a == null || b == null) return Math.round(stage.scrollLeft / maxScroll * 100) + "%";
    return fmtDay(a) + " to " + fmtDay(b);
  }

  function buildMinimap() {
    if (!mmInner) return;
    while (mmInner.firstChild) mmInner.removeChild(mmInner.firstChild);
    if (!metrics.W) return;
    var frag = document.createDocumentFragment();
    if (scaleMode !== "ordinal") {
      eras.forEach(function (er, idx) {
        var x1 = xForTime(dayVal(er.start)), x2 = xForTime(dayVal(er.end));
        if (x1 == null || x2 == null || x2 - x1 < 2) return;
        var span = el("span", "mm-era" + (idx % 2 ? " alt" : ""));
        span.style.left = (x1 / metrics.W * 100) + "%";
        span.style.width = ((x2 - x1) / metrics.W * 100) + "%";
        frag.append(span);
      });
      segments.forEach(function (sg) {
        if (sg.type !== "gap") return;
        var g = el("span", "mm-gap");
        g.style.left = (sg.x0 / metrics.W * 100) + "%";
        g.style.width = ((sg.x1 - sg.x0) / metrics.W * 100) + "%";
        frag.append(g);
      });
    }
    events.forEach(function (ev) {
      var tick = el("span", "mm-ev");
      tick.style.left = (ev._cx / metrics.W * 100) + "%";
      frag.append(tick);
    });
    mmInner.append(frag);
  }

  function updateMinimap() {
    if (!mmEl) return;
    var dossier = document.body.classList.contains("dossier");
    var maxScroll = stage.scrollWidth - stage.clientWidth;
    if (dossier || !metrics.W || maxScroll <= 4) {
      mmEl.hidden = true;
      document.body.classList.remove("has-minimap");
      return;
    }
    mmEl.hidden = false;
    document.body.classList.add("has-minimap");
    var tw = mmTrack.clientWidth;
    if (!tw) return;
    var thumbW = Math.max(24, Math.round(tw * stage.clientWidth / stage.scrollWidth));
    var pos = maxScroll > 0 ? stage.scrollLeft / maxScroll : 0;
    mmThumb.style.width = thumbW + "px";
    mmThumb.style.transform = "translateX(" + Math.round(pos * (tw - thumbW)) + "px)";
    mmThumb.setAttribute("aria-valuenow", String(Math.round(pos * 100)));
    mmThumb.setAttribute("aria-valuetext", minimapValueText());
  }

  function scheduleMinimap() {
    clearTimeout(mmTimer);
    mmTimer = setTimeout(updateMinimap, 16);
  }
  stage.addEventListener("scroll", scheduleMinimap, { passive: true });

  if (mmTrack && mmThumb) {
    mmTrack.addEventListener("pointerdown", function (e) {
      if (e.target === mmThumb) return;
      var r = mmTrack.getBoundingClientRect();
      var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      stage.scrollLeft = f * (stage.scrollWidth - stage.clientWidth);
      mmThumb.focus();
    });
    var mmDrag = null;
    mmThumb.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { mmThumb.setPointerCapture(e.pointerId); } catch (err) {}
      var r = mmTrack.getBoundingClientRect();
      mmDrag = {
        x: e.clientX, left: stage.scrollLeft,
        trackW: r.width, thumbW: mmThumb.offsetWidth,
        maxScroll: stage.scrollWidth - stage.clientWidth
      };
    });
    mmThumb.addEventListener("pointermove", function (e) {
      if (!mmDrag) return;
      var range = mmDrag.trackW - mmDrag.thumbW;
      if (range <= 0) return;
      var dx = e.clientX - mmDrag.x;
      stage.scrollLeft = Math.max(0, Math.min(mmDrag.maxScroll, mmDrag.left + dx / range * mmDrag.maxScroll));
    });
    function mmEnd(e) {
      if (!mmDrag) return;
      mmDrag = null;
      try { mmThumb.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    mmThumb.addEventListener("pointerup", mmEnd);
    mmThumb.addEventListener("pointercancel", mmEnd);
    mmThumb.addEventListener("keydown", function (e) {
      var page = Math.max(80, stage.clientWidth * 0.9);
      if (e.key === "ArrowRight") { stage.scrollLeft += Math.max(40, stage.clientWidth * 0.1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { stage.scrollLeft -= Math.max(40, stage.clientWidth * 0.1); e.preventDefault(); }
      else if (e.key === "PageDown") { stage.scrollLeft += page; e.preventDefault(); }
      else if (e.key === "PageUp") { stage.scrollLeft -= page; e.preventDefault(); }
      else if (e.key === "Home") { stage.scrollLeft = 0; e.preventDefault(); }
      else if (e.key === "End") { stage.scrollLeft = stage.scrollWidth; e.preventDefault(); }
    });
  }

  /* ---------- exports ---------- */
  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function baseName() {
    return String(D.title || "chronology").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "chronology";
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  function cleanData() {
    return JSON.stringify(D, function (key, value) {
      return key.charAt(0) === "_" ? undefined : value;
    }, 2);
  }
  function sourceLabel(s) {
    return s && typeof s === "object" ? (s.label || s.url || "") : String(s || "");
  }
  function csvCell(v) {
    var s = v == null ? "" : String(v);
    if (/^[=+@\t\r]/.test(s) || /^-[A-Za-z]/.test(s)) s = "'" + s;
    if (/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportJSON() {
    download(baseName() + ".json", cleanData() + "\n", "application/json;charset=utf-8");
  }
  function exportCSV() {
    var rows = [["id", "start", "end", "date_label", "precision", "status", "confidence", "title", "actors", "tags", "sources", "counter_sources", "links_in", "links_out"]];
    var inN = new Map(), outN = new Map();
    links.forEach(function (ln) {
      if (!ln) return;
      outN.set(ln.from, (outN.get(ln.from) || 0) + 1);
      inN.set(ln.to, (inN.get(ln.to) || 0) + 1);
    });
    events.forEach(function (ev) {
      rows.push([
        ev.id, ev.start || "", ev.end || "", ev.date_label || "", ev.precision || "",
        ev.status || "", typeof ev.confidence === "number" ? ev.confidence : "",
        ev.title || "",
        (Array.isArray(ev.actors) ? ev.actors.map(entName) : []).join("; "),
        (Array.isArray(ev.tags) ? ev.tags : []).join("; "),
        (Array.isArray(ev.sources) ? ev.sources.map(sourceLabel) : []).join("; "),
        (Array.isArray(ev.counter_sources) ? ev.counter_sources.map(sourceLabel) : []).join("; "),
        inN.get(ev.id) || 0, outN.get(ev.id) || 0
      ]);
    });
    var body = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    download(baseName() + ".csv", "\ufeff" + body + "\r\n", "text/csv;charset=utf-8");
  }
  function mermaidEsc(s) {
    return String(s == null ? "" : s)
      .replace(/#/g, "#35;").replace(/"/g, "#quot;").replace(/\|/g, "#124;")
      .replace(/\r?\n/g, "<br/>");
  }
  function mermaidId(id) { return "n_" + String(id).replace(/[^A-Za-z0-9_]/g, "_"); }
  function exportMermaid() {
    var lines = ["flowchart LR"];
    events.forEach(function (ev) {
      lines.push("  " + mermaidId(ev.id) + '["' + mermaidEsc(ev.title || ev.id) + '"]');
    });
    links.forEach(function (ln) {
      if (!valid(ln)) return;
      lines.push("  " + mermaidId(ln.from) + ' -->|"' + mermaidEsc(ln.label || "led to") + '"| ' + mermaidId(ln.to));
    });
    download(baseName() + ".mmd", lines.join("\n") + "\n", "text/plain;charset=utf-8");
  }
  function isoParts(s) {
    var m = String(s == null ? "" : s).trim().match(/^(-?)(\d+)(?:-(\d{2}))?(?:-(\d{2}))?$/);
    if (!m) return null;
    var y = +m[2]; if (m[1] === "-") y = -y;
    var o = { year: y };
    if (m[3]) o.month = +m[3];
    if (m[4]) o.day = +m[4];
    return o;
  }
  function tlHTML(ev) {
    var out = [];
    if (ev.description) out.push("<p>" + escHtml(ev.description) + "</p>");
    var facts = [];
    if (ev.status) facts.push("<dt>Status</dt><dd>" + escHtml(ev.status) + "</dd>");
    if (typeof ev.confidence === "number") facts.push("<dt>Confidence</dt><dd>" + ev.confidence.toFixed(2) + "</dd>");
    if (Array.isArray(ev.actors) && ev.actors.length) facts.push("<dt>Actors</dt><dd>" + escHtml(ev.actors.map(entName).join(", ")) + "</dd>");
    if (Array.isArray(ev.tags) && ev.tags.length) facts.push("<dt>Tags</dt><dd>" + escHtml(ev.tags.join(", ")) + "</dd>");
    if (facts.length) out.push("<dl>" + facts.join("") + "</dl>");
    function srcList(list, heading) {
      if (!Array.isArray(list) || !list.length) return;
      out.push("<p><b>" + heading + "</b></p><ul>");
      list.forEach(function (s) {
        var label = escHtml(sourceLabel(s));
        var url = s && typeof s === "object" ? s.url : null;
        var line = url && /^https?:\/\//i.test(url) ? '<a href="' + escHtml(url) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>" : label;
        if (s && typeof s === "object" && s.locator) line += " · " + escHtml(s.locator);
        if (s && typeof s === "object" && s.excerpt) line += ' — <q>' + escHtml(s.excerpt) + "</q>";
        out.push("<li>" + line + "</li>");
      });
      out.push("</ul>");
    }
    srcList(ev.sources, "Sources");
    srcList(ev.counter_sources, "Counter-sources");
    var ins = (relIn.get(ev.id) || []).filter(valid), outs = (relOut.get(ev.id) || []).filter(valid);
    if (ins.length || outs.length) {
      out.push('<p class="cs-rel"><b>Relations</b></p><ul>');
      ins.forEach(function (ln) { out.push("<li>From " + escHtml((byId.get(ln.from) || {}).title || ln.from) + " — " + escHtml(ln.label || "led to") + "</li>"); });
      outs.forEach(function (ln) { out.push("<li>To " + escHtml((byId.get(ln.to) || {}).title || ln.to) + " — " + escHtml(ln.label || "led to") + "</li>"); });
      out.push("</ul>");
    }
    return out.join("");
  }
  function exportTimelineJS() {
    var tlEvents = [];
    events.forEach(function (ev) {
      var start = isoParts(ev.start);
      if (!start) return;
      var row = {
        unique_id: ev.id,
        start_date: start,
        text: { headline: ev.title || ev.id, text: tlHTML(ev) }
      };
      var end = isoParts(ev.end);
      if (end) row.end_date = end;
      var dd = dateText(ev);
      if (dd) row.display_date = dd;
      if (ev.status) row.group = ev.status;
      tlEvents.push(row);
    });
    var tlEras = [];
    eras.forEach(function (er) {
      var s = isoParts(er.start), e = isoParts(er.end);
      if (!s || !e) return;
      tlEras.push({ start_date: s, end_date: e, text: { headline: er.label || "" } });
    });
    var data = {
      title: { text: { headline: D.title || "Chronology", text: D.subtitle || "" } },
      events: tlEvents
    };
    if (tlEras.length) data.eras = tlEras;
    download(baseName() + "-timelinejs.json", JSON.stringify(data, null, 2) + "\n", "application/json;charset=utf-8");
  }

  var expEl = document.getElementById("exp");
  if (expEl) {
    expEl.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button[data-exp]") : null;
      if (!b) return;
      var kind = b.dataset.exp;
      if (kind === "json") exportJSON();
      else if (kind === "csv") exportCSV();
      else if (kind === "mermaid") exportMermaid();
      else if (kind === "timelinejs") exportTimelineJS();
      expEl.open = false;
    });
    expEl.addEventListener("keydown", function (e) {
      if (e.key === "Escape") expEl.open = false;
    });
    document.addEventListener("click", function (e) {
      if (expEl.open && !expEl.contains(e.target)) expEl.open = false;
    });
  }

  /* ---------- deep links (#event-id) ---------- */
  function jumpToHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    var ev = byId.get(decodeURIComponent(h));
    if (!ev || !ev._card) return;
    stage.scrollTo({ left: Math.max(0, ev._cx - stage.clientWidth / 2), behavior: "auto" });
    try { ev._card.focus({ preventScroll: true }); } catch (e) { ev._card.focus(); }
  }
  window.addEventListener("hashchange", jumpToHash);

  /* ---------- init ---------- */
  layout();
  jumpToHash();
  updateHops();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
  window.addEventListener("resize", scheduleLayout);
})();
</script>
</body>
</html>
